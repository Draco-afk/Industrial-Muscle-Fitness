<script>
    // ได้รับ token มาจากการ Login ที่ผ่านการตรวจสอบแล้วเท่านั้น (MemberLogin.html -> loginMember())
    const SESSION_TOKEN = "<?= sessionToken ?>";

    let selectedTrainerId = '';
    let selectedSlot = '';

    function loadProfile() {
      google.script.run
        .withSuccessHandler(renderMemberDashboard)
        .withFailureHandler(goToMemberLoginIfExpired)
        .getMemberProfile(SESSION_TOKEN);
    }

    function goToMemberLoginIfExpired(err) {
      const msg = (err && err.message) ? err.message : String(err);
      if (msg.indexOf('Session') !== -1) {
        localStorage.removeItem('im_member_token');
      }
      alert(msg.indexOf('Session') !== -1 ? 'Session หมดอายุ กรุณา Login ใหม่' : ('เกิดข้อผิดพลาด: ' + msg));
      window.top.location.href = "<?= getScriptUrl() ?>?page=member";
    }

    let currentMemberProfile = null;

    function renderMemberDashboard(m) {
      currentMemberProfile = m;
      document.getElementById('loadingSection').classList.add('hidden');
      document.getElementById('memberDashboard').classList.remove('hidden');

      document.getElementById('displayName').innerText = m.fullName;
      document.getElementById('displayPackage').innerText = m.package;
      document.getElementById('displayExpiry').innerText = m.expiryDate;
      document.getElementById('displayPin').innerText = m.pin || 'ไม่ได้ตั้งไว้';

      const statusEl = document.getElementById('displayStatus');
      if (m.status === 'Active') {
        statusEl.innerText = 'Active';
        statusEl.className = 'px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-green-950 text-green-400 border border-green-800';
      } else if (m.status === 'Suspended') {
        statusEl.innerText = 'Freeze';
        statusEl.className = 'px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-yellow-950 text-yellow-400 border border-yellow-800';
      } else {
        statusEl.innerText = m.status || 'Inactive';
        statusEl.className = 'px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-gray-800 text-gray-400 border border-gray-700';
      }

      renderExpiryAlertBanner(m);
      document.getElementById('birthdayBanner').classList.toggle('hidden', !m.isBirthdayMonth);
      if (m.isBirthdayMonth && m.birthdayDiscountLabel) {
        document.getElementById('birthdayBannerText').innerText = '🎂 เดือนเกิดของคุณ! ต่ออายุสมาชิกภาพเดือนนี้รับส่วนลด ' + m.birthdayDiscountLabel + ' ทันที';
      }
      renderMemberLineStatus(m.lineLinked);

      const historyEl = document.getElementById('paymentHistoryList');
      if (m.paymentHistory && m.paymentHistory.length > 0) {
        historyEl.innerHTML = '';
        m.paymentHistory.forEach(p => {
          const row = document.createElement('div');
          row.className = "flex justify-between items-center text-xs border-b border-gray-900 pb-2 last:border-0 last:pb-0";
          row.innerHTML = `
            <div>
              <p class="text-white font-medium">${p.package}</p>
              <p class="text-gray-600 text-[10px] font-mono">${p.timestamp}</p>
            </div>
            <span class="text-green-400 font-mono font-bold">${p.newExpiry}</span>
          `;
          historyEl.appendChild(row);
        });
      }
    }

    function renderExpiryAlertBanner(m) {
      const banner = document.getElementById('expiryAlertBanner');
      const icon = document.getElementById('expiryAlertIcon');
      const text = document.getElementById('expiryAlertText');

      if (m.isExpired) {
        banner.className = 'rounded-2xl p-4 flex items-center gap-3 bg-red-950/50 border border-red-800';
        icon.className = 'fa-solid fa-circle-xmark text-xl shrink-0 text-red-500';
        text.className = 'text-xs font-bold leading-relaxed text-red-300';
        text.innerText = 'สมาชิกภาพของคุณหมดอายุไปแล้ว ' + Math.abs(m.daysLeft) + ' วัน กรุณาติดต่อเจ้าหน้าที่เพื่อต่ออายุ';
        banner.classList.remove('hidden');
      } else if (m.nearExpiry) {
        banner.className = 'rounded-2xl p-4 flex items-center gap-3 bg-yellow-950/40 border border-yellow-700';
        icon.className = 'fa-solid fa-triangle-exclamation text-xl shrink-0 text-yellow-500';
        text.className = 'text-xs font-bold leading-relaxed text-yellow-300';
        text.innerText = m.daysLeft === 0
          ? 'สมาชิกภาพของคุณหมดอายุวันนี้! กรุณาต่ออายุเพื่อใช้บริการต่อเนื่อง'
          : 'สมาชิกภาพของคุณใกล้หมดอายุ เหลืออีก ' + m.daysLeft + ' วัน กรุณาต่ออายุล่วงหน้า';
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }
    }

    function toggleChangePinForm() {
      document.getElementById('changePinForm').classList.toggle('hidden');
    }

    function submitChangePin() {
      const oldPin = document.getElementById('oldPinInput').value.trim();
      const newPin = document.getElementById('newPinInput').value.trim();
      if (!/^\d{4}$/.test(oldPin) || !/^\d{4}$/.test(newPin)) {
        alert('กรุณากรอก PIN เดิมและ PIN ใหม่ให้ครบ 4 หลัก');
        return;
      }
      const btn = document.getElementById('btnChangePin');
      btn.disabled = true; btn.innerText = 'กำลังบันทึก...';

      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          btn.disabled = false; btn.innerText = 'บันทึก PIN ใหม่';
          if (res.success) {
            document.getElementById('oldPinInput').value = '';
            document.getElementById('newPinInput').value = '';
            document.getElementById('changePinForm').classList.add('hidden');
            loadProfile(); // รีโหลดข้อมูลเพื่ออัปเดต displayPin
          }
        })
        .withFailureHandler(err => {
          goToMemberLoginIfExpired(err);
          btn.disabled = false; btn.innerText = 'บันทึก PIN ใหม่';
        })
        .changeMemberPin(SESSION_TOKEN, oldPin, newPin);
    }

    // ==========================================
    // เทรนเนอร์ของเรา (โปรไฟล์ + ประวัติ) + จองคิวเทรนเนอร์
    // ==========================================
    function openTrainerScreen() {
      document.getElementById('trainerScreen').classList.remove('hidden');
    }

    function closeTrainerScreen() {
      document.getElementById('trainerScreen').classList.add('hidden');
    }

    function openCardScreen() {
      if (!currentMemberProfile) return;
      const m = currentMemberProfile;

      document.getElementById('cardMemberName').innerText = m.fullName;
      document.getElementById('cardPackage').innerText = m.package;
      document.getElementById('cardStartDate').innerText = m.startDate || '--';
      document.getElementById('cardExpiryDate').innerText = m.expiryDate || '--';
      document.getElementById('cardPhone').innerText = m.phone || '--';

      const badge = document.getElementById('cardStatusBadge');
      if (m.status === 'Active') {
        badge.innerText = 'ACTIVE';
        badge.className = 'text-[9px] px-3 py-1 rounded-full border font-bold uppercase tracking-widest shrink-0 bg-green-950 text-green-400 border-green-800';
      } else if (m.status === 'Suspended') {
        badge.innerText = 'FREEZE';
        badge.className = 'text-[9px] px-3 py-1 rounded-full border font-bold uppercase tracking-widest shrink-0 bg-yellow-950 text-yellow-400 border-yellow-800';
      } else {
        badge.innerText = m.status || 'INACTIVE';
        badge.className = 'text-[9px] px-3 py-1 rounded-full border font-bold uppercase tracking-widest shrink-0 bg-gray-800 text-gray-400 border-gray-700';
      }

      renderAddToHomeInstructions();
      document.getElementById('cardScreen').classList.remove('hidden');
    }

    function closeCardScreen() {
      document.getElementById('cardScreen').classList.add('hidden');
    }

    function renderAddToHomeInstructions() {
      const el = document.getElementById('addToHomeInstructions');
      const ua = navigator.userAgent;
      const isIOS = /iPad|iPhone|iPod/.test(ua);
      const isAndroid = /Android/.test(ua);

      if (isIOS) {
        el.innerHTML =
          '<p>1. แตะปุ่ม <b>แชร์</b> <i class="fa-solid fa-arrow-up-from-bracket"></i> ที่แถบด้านล่างของ Safari</p>' +
          '<p>2. เลื่อนหา <b>"เพิ่มไปยังหน้าจอโฮม"</b> (Add to Home Screen)</p>' +
          '<p>3. กด <b>"เพิ่ม"</b> — จะมีไอคอนแอปนี้อยู่ที่หน้าจอโฮมทันที</p>';
      } else if (isAndroid) {
        el.innerHTML =
          '<p>1. แตะเมนู <b>⋮</b> มุมขวาบนของเบราว์เซอร์</p>' +
          '<p>2. เลือก <b>"เพิ่มไปยังหน้าจอโฮม"</b> หรือ <b>"ติดตั้งแอป"</b></p>' +
          '<p>3. กดยืนยัน — จะมีไอคอนแอปนี้อยู่ที่หน้าจอโฮมทันที</p>';
      } else {
        el.innerHTML = '<p>เปิดหน้านี้จากมือถือ แล้วใช้เมนูเบราว์เซอร์เพื่อ "เพิ่มไปยังหน้าจอโฮม"</p>';
      }
    }

    let localTrainersForProfile = [];
    const TRAINER_DAY_LABEL_ = { Mon: 'จันทร์', Tue: 'อังคาร', Wed: 'พุธ', Thu: 'พฤหัสบดี', Fri: 'ศุกร์', Sat: 'เสาร์', Sun: 'อาทิตย์' };

    function loadAvailableTrainers() {
      google.script.run
        .withSuccessHandler(list => {
          localTrainersForProfile = list || [];

          const select = document.getElementById('trainerSelect');
          select.innerHTML = '<option value="">-- เลือกเทรนเนอร์ --</option>';
          list.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.trainerId;
            opt.innerText = t.fullName + (t.specialty ? ' (' + t.specialty + ')' : '');
            select.appendChild(opt);
          });

          renderTrainerProfileGrid(list);
        })
        .withFailureHandler(goToMemberLoginIfExpired)
        .getAvailableTrainers(SESSION_TOKEN);
    }

    function renderTrainerProfileGrid(list) {
      const grid = document.getElementById('trainerProfileGrid');
      if (!list || list.length === 0) {
        grid.innerHTML = '<p class="text-gray-600 text-xs text-center py-6 col-span-full">ยังไม่มีเทรนเนอร์ในระบบ</p>';
        return;
      }
      grid.innerHTML = '';
      list.forEach(t => {
        const card = document.createElement('div');
        card.className = 'bg-black/40 border border-gray-800 hover:border-red-500/50 rounded-2xl p-3 text-center cursor-pointer transition-all';
        card.onclick = () => openTrainerProfile(t.trainerId);
        const photoHtml = t.photoUrl
          ? `<div class="w-16 h-16 rounded-xl bg-gray-900 mx-auto mb-2 flex items-center justify-center border-2 border-gray-800 overflow-hidden relative"><img src="${t.photoUrl}" onerror="this.style.display='none'" class="w-full h-full object-cover absolute inset-0"><i class="fa-solid fa-user text-xl text-gray-700 relative"></i></div>`
          : `<div class="w-16 h-16 rounded-xl bg-gray-900 mx-auto mb-2 flex items-center justify-center border-2 border-gray-800"><i class="fa-solid fa-user text-xl text-gray-700"></i></div>`;
        const busyBadgeHtml = t.busyStatus === 'Busy'
          ? '<span class="text-[9px] bg-red-950 text-red-400 border border-red-800 px-1.5 py-0.5 rounded-full font-bold mt-1 inline-block">ติดลูกค้า</span>'
          : '<span class="text-[9px] bg-green-950 text-green-400 border border-green-800 px-1.5 py-0.5 rounded-full font-bold mt-1 inline-block">ว่าง</span>';
        card.innerHTML = photoHtml +
          `<p class="text-white text-xs font-bold truncate">${t.fullName}</p>` +
          `<p class="text-red-400 text-[10px] truncate">${t.specialty || 'เทรนเนอร์'}</p>` +
          busyBadgeHtml;
        grid.appendChild(card);
      });
    }

    let selectedProfileTrainerId = '';

    function openTrainerProfile(trainerId) {
      const t = localTrainersForProfile.find(x => x.trainerId === trainerId);
      if (!t) return;
      selectedProfileTrainerId = trainerId;

      const photo = document.getElementById('modalTrainerPhoto');
      const placeholder = document.getElementById('modalTrainerPlaceholder');
      if (t.photoUrl) { photo.src = t.photoUrl; photo.classList.remove('hidden'); placeholder.classList.add('hidden'); }
      else { photo.classList.add('hidden'); placeholder.classList.remove('hidden'); }

      document.getElementById('modalTrainerName').innerText = t.fullName;
      document.getElementById('modalTrainerSpecialty').innerText = t.specialty || 'เทรนเนอร์ประจำยิม';
      document.getElementById('modalTrainerBio').innerText = t.bio && t.bio.trim() ? t.bio : 'ยังไม่มีข้อมูลประวัติ';

      const daysEl = document.getElementById('modalTrainerDays');
      daysEl.innerHTML = '';
      (t.workingDays || []).forEach(d => {
        const chip = document.createElement('span');
        chip.className = 'text-[10px] bg-red-950 text-red-400 border border-red-800 px-2 py-1 rounded-full font-bold';
        chip.innerText = TRAINER_DAY_LABEL_[d] || d;
        daysEl.appendChild(chip);
      });
      document.getElementById('modalTrainerHours').innerText = (t.startHour || '--:--') + ' - ' + (t.endHour || '--:--') + ' น.';

      document.getElementById('trainerProfileModal').classList.remove('hidden');
    }

    function closeTrainerProfile() {
      document.getElementById('trainerProfileModal').classList.add('hidden');
    }

    function bookThisTrainer() {
      closeTrainerProfile();
      document.getElementById('trainerSelect').value = selectedProfileTrainerId;
      onTrainerChange();
      document.getElementById('trainerBookingSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function onTrainerChange() {
      selectedTrainerId = document.getElementById('trainerSelect').value;
      if (!document.getElementById('bookingDate').value) {
        document.getElementById('bookingDate').valueAsDate = new Date();
      }
      loadTrainerSlots();
    }

    function loadTrainerSlots() {
      const dateStr = document.getElementById('bookingDate').value;
      const container = document.getElementById('slotsContainer');
      const msg = document.getElementById('slotsMsg');
      container.innerHTML = '';
      msg.innerText = '';
      document.getElementById('btnConfirmBooking').classList.add('hidden');
      selectedSlot = '';

      if (!selectedTrainerId || !dateStr) return;
      msg.innerText = 'กำลังโหลดช่วงเวลาว่าง...';

      google.script.run
        .withSuccessHandler(res => {
          msg.innerText = '';
          if (!res.success) { msg.innerText = res.message || 'เกิดข้อผิดพลาด'; return; }

          const freeSlots = res.slots || [];
          const bookedSlots = res.bookedSlots || [];
          if (freeSlots.length === 0 && bookedSlots.length === 0) {
            msg.innerText = res.message || 'ไม่มีช่วงเวลาในวันที่เลือก';
            return;
          }

          freeSlots.forEach(slot => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'bg-black border border-gray-800 hover:border-red-500 text-gray-300 text-[11px] py-2 rounded-lg cursor-pointer';
            btn.innerText = slot;
            btn.onclick = () => selectSlot(slot, btn);
            container.appendChild(btn);
          });

          bookedSlots.forEach(slot => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'bg-yellow-950/40 border border-yellow-800 text-yellow-500 text-[10px] py-2 rounded-lg cursor-pointer flex flex-col items-center leading-tight';
            btn.innerHTML = slot + '<span class="text-[8px] mt-0.5">เต็ม - เข้าคิวรอ</span>';
            btn.onclick = () => joinWaitlistUI(slot);
            container.appendChild(btn);
          });
        })
        .withFailureHandler(goToMemberLoginIfExpired)
        .getTrainerAvailableSlots(SESSION_TOKEN, selectedTrainerId, dateStr);
    }

    function joinWaitlistUI(slot) {
      const dateStr = document.getElementById('bookingDate').value;
      if (!confirm('ช่วงเวลา ' + slot + ' เต็มแล้ว ต้องการเข้าคิวรอไหม? ถ้ามีคนยกเลิก ระบบจะแจ้งคุณทันที')) return;
      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          if (res.success) loadMyWaitlist();
        })
        .withFailureHandler(goToMemberLoginIfExpired)
        .joinWaitlist(SESSION_TOKEN, selectedTrainerId, dateStr, slot);
    }

    function selectSlot(slot, btnEl) {
      selectedSlot = slot;
      document.querySelectorAll('#slotsContainer button').forEach(b => {
        b.className = 'bg-black border border-gray-800 hover:border-red-500 text-gray-300 text-[11px] py-2 rounded-lg cursor-pointer';
      });
      btnEl.className = 'bg-red-600 border border-red-500 text-white text-[11px] py-2 rounded-lg cursor-pointer font-bold';
      document.getElementById('selectedSlotText').innerText = slot;
      document.getElementById('btnConfirmBooking').classList.remove('hidden');
    }

    function confirmBooking() {
      const dateStr = document.getElementById('bookingDate').value;
      if (!selectedTrainerId || !dateStr || !selectedSlot) return;
      const btn = document.getElementById('btnConfirmBooking');
      btn.disabled = true;

      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          btn.disabled = false;
          if (res.success) {
            loadTrainerSlots();
            loadMyBookings();
          }
        })
        .withFailureHandler(err => { goToMemberLoginIfExpired(err); btn.disabled = false; })
        .bookTrainerSlot(SESSION_TOKEN, selectedTrainerId, dateStr, selectedSlot);
    }

    function loadMyBookings() {
      const container = document.getElementById('myBookingsList');
      google.script.run
        .withSuccessHandler(list => {
          if (!list || list.length === 0) {
            container.innerHTML = '<p class="text-gray-600 text-xs text-center py-4">ไม่มีคิวที่จอง</p>';
            return;
          }
          container.innerHTML = '';
          list.forEach(b => {
            let badgeClass = 'bg-green-950 text-green-400 border-green-800';
            if (b.status === 'Cancelled') badgeClass = 'bg-gray-800 text-gray-400 border-gray-700';
            else if (b.status === 'Completed') badgeClass = 'bg-blue-950 text-blue-400 border-blue-800';

            const row = document.createElement('div');
            row.className = 'flex justify-between items-center text-xs border-b border-gray-900 pb-2 last:border-0 last:pb-0';
            row.innerHTML =
              '<div>' +
                '<p class="text-white font-medium">' + b.trainerName + '</p>' +
                '<p class="text-gray-500 text-[10px] font-mono">' + b.date + ' • ' + b.timeSlot + '</p>' +
              '</div>' +
              '<div class="flex items-center gap-2">' +
                '<span class="text-[9px] px-2 py-0.5 rounded-full border ' + badgeClass + ' font-bold uppercase">' + b.status + '</span>' +
                (b.status === 'Booked' ? '<button onclick="cancelBooking(\'' + b.bookingId + '\')" class="text-red-500 hover:text-red-400 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>' : '') +
              '</div>';
            container.appendChild(row);
          });
        })
        .withFailureHandler(goToMemberLoginIfExpired)
        .getMyBookings(SESSION_TOKEN);
    }

    function loadMyWaitlist() {
      const container = document.getElementById('myWaitlistList');
      google.script.run
        .withSuccessHandler(list => {
          if (!list || list.length === 0) {
            container.innerHTML = '<p class="text-gray-600 text-xs text-center py-4">ไม่มีคิวที่รออยู่</p>';
            return;
          }
          container.innerHTML = '';
          list.forEach(w => {
            let badgeClass = 'bg-yellow-950 text-yellow-400 border-yellow-800';
            if (w.status === 'Notified') badgeClass = 'bg-green-950 text-green-400 border-green-800';

            const row = document.createElement('div');
            row.className = 'flex justify-between items-center text-xs border-b border-gray-900 pb-2 last:border-0 last:pb-0';
            row.innerHTML =
              '<div>' +
                '<p class="text-white font-medium">' + w.trainerName + '</p>' +
                '<p class="text-gray-500 text-[10px] font-mono">' + w.date + ' • ' + w.timeSlot + '</p>' +
              '</div>' +
              '<div class="flex items-center gap-2">' +
                '<span class="text-[9px] px-2 py-0.5 rounded-full border ' + badgeClass + ' font-bold uppercase">' + (w.status === 'Notified' ? 'ว่างแล้ว!' : 'กำลังรอ') + '</span>' +
                '<button onclick="cancelWaitlistUI(' + w.rowNumber + ')" class="text-red-500 hover:text-red-400 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>' +
              '</div>';
            container.appendChild(row);
          });
        })
        .withFailureHandler(goToMemberLoginIfExpired)
        .getMyWaitlist(SESSION_TOKEN);
    }

    function cancelWaitlistUI(rowNumber) {
      if (!confirm('ยืนยันยกเลิกการรอคิวนี้?')) return;
      google.script.run
        .withSuccessHandler(res => { alert(res.message); if (res.success) loadMyWaitlist(); })
        .withFailureHandler(goToMemberLoginIfExpired)
        .cancelMyWaitlistEntry(SESSION_TOKEN, rowNumber);
    }

    // ==========================================
    // 💬 เชื่อมต่อ LINE รับแจ้งเตือน (ใกล้หมดอายุ / วันเกิด / คูปองใหม่)
    // ==========================================

    function renderMemberLineStatus(linked) {
      const statusText = document.getElementById('memberLineStatusText');
      const linkedSection = document.getElementById('memberLineLinkedSection');
      const notLinkedSection = document.getElementById('memberLineNotLinkedSection');
      if (linked) {
        statusText.innerText = '✅ เชื่อมต่อแล้ว';
        linkedSection.classList.remove('hidden');
        notLinkedSection.classList.add('hidden');
        document.getElementById('memberLineLinkInstructions').classList.add('hidden');
      } else {
        statusText.innerText = 'ยังไม่ได้เชื่อมต่อ';
        linkedSection.classList.add('hidden');
        notLinkedSection.classList.remove('hidden');
      }
    }

    function startMemberLineLink() {
      google.script.run
        .withSuccessHandler(res => {
          if (!res.success) { alert(res.message); return; }
          document.getElementById('memberLineLinkCodeDisplay').innerText = res.code;
          document.getElementById('memberLineLinkInstructions').classList.remove('hidden');

          google.script.run
            .withSuccessHandler(settings => {
              const link = document.getElementById('memberLineAddFriendLink');
              if (settings.addFriendUrl) {
                link.href = settings.addFriendUrl;
                link.innerText = 'แตะเพื่อเพิ่มเพื่อน LINE ร้าน';
              } else {
                link.href = '#';
                link.innerText = 'ยังไม่มีลิงก์เพิ่มเพื่อน - สอบถามแอดมิน';
              }
            })
            .withFailureHandler(goToMemberLoginIfExpired)
            .getLineAddFriendUrlForMember(SESSION_TOKEN);
        })
        .withFailureHandler(goToMemberLoginIfExpired)
        .generateMyMemberLineLinkCode(SESSION_TOKEN);
    }

    function unlinkMemberLineUI() {
      if (!confirm('ยืนยันยกเลิกการเชื่อมต่อ LINE?')) return;
      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          if (res.success) renderMemberLineStatus(false);
        })
        .withFailureHandler(goToMemberLoginIfExpired)
        .unlinkMyMemberLine(SESSION_TOKEN);
    }

    function cancelBooking(bookingId) {
      if (!confirm('ยืนยันยกเลิกคิวนี้?')) return;
      google.script.run
        .withSuccessHandler(res => { alert(res.message); loadMyBookings(); loadTrainerSlots(); })
        .withFailureHandler(goToMemberLoginIfExpired)
        .cancelMyBooking(SESSION_TOKEN, bookingId);
    }

    function logoutClient() {
      if (!confirm('ยืนยันออกจากระบบ?')) return;
      google.script.run.logoutMember(SESSION_TOKEN);
      localStorage.removeItem('im_member_token');
      localStorage.removeItem('im_member_biometric');
      localStorage.removeItem('im_member_biometric_id');
      window.top.location.href = "<?= getScriptUrl() ?>?page=member";
    }

    window.onload = () => {
      loadProfile();
      loadAvailableTrainers();
      loadMyBookings();
      loadMyWaitlist();
    };
  </script>
