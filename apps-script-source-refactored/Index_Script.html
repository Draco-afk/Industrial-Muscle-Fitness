    function calculateExpiryDate() {
      const start = document.getElementById('startDate').value;
      const pkg = document.getElementById('package').value;
      if (!start) return;
      let date = new Date(start);
      const pkgInfo = (localPackagesArray || []).find(p => p.name === pkg);
      const durationMonths = pkgInfo ? pkgInfo.durationMonths : 1;
      date.setMonth(date.getMonth() + durationMonths);
      document.getElementById('expiryDate').value = date.toISOString().split('T')[0];

      const amountInput = document.getElementById('memberChargeAmount');
      const badge = document.getElementById('birthdayDiscountBadge');
      if (amountInput && !document.getElementById('rowNumber').value) {
        let price = pkgInfo ? pkgInfo.price : 0;
        const dobVal = document.getElementById('memberDob').value;
        const isBirthday = dobVal && new Date(dobVal).getMonth() === new Date().getMonth();
        if (isBirthday) {
          price = birthdayDiscountSettings.type === 'Fixed'
            ? Math.max(0, price - birthdayDiscountSettings.value)
            : Math.round(price * (1 - birthdayDiscountSettings.value / 100) * 100) / 100;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
        amountInput.value = price;
      }
    }

    function downloadBase64File(filename, base64Data, mimeType) {
      const byteChars = atob(base64Data);
      const byteNumbers = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 🖨️ เปิดหน้าต่างใหม่แสดงใบเสร็จสไตล์เครื่องพิมพ์ความร้อน 80mm แล้วสั่งพิมพ์อัตโนมัติ
    // พร้อมปุ่มดาวน์โหลดไฟล์ PDF แยกไว้ให้ด้วย เผื่ออยากเก็บไฟล์/ส่งต่อโดยไม่ต้องพิมพ์จริง
    function openThermalReceiptWindow(html, pdfBase64, filename) {
      const w = window.open('', '_blank', 'width=400,height=650');
      if (!w) { alert('เบราว์เซอร์บล็อกป๊อปอัพ กรุณาอนุญาตป๊อปอัพสำหรับเว็บนี้แล้วลองใหม่'); return; }
      w.document.open();
      w.document.write(html);
      w.document.close();

      if (pdfBase64) {
        w.addEventListener('load', () => {
          const bar = w.document.querySelector('.printbar');
          if (!bar) return;
          const link = w.document.createElement('a');
          link.href = 'data:application/pdf;base64,' + pdfBase64;
          link.download = filename || 'receipt.pdf';
          link.style.cssText = 'display:inline-block;background:#374151;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;text-decoration:none;margin-left:8px;font-family:inherit;';
          link.innerText = '⬇️ ดาวน์โหลด PDF';
          bar.appendChild(link);
        });
      }
    }

    function renderCouponTable() {
      const tbody = document.getElementById('couponListTableBody');
      if (!tbody) return;
      if (localCouponsArray.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-gray-600">ยังไม่มีคูปองในระบบ...</td></tr>';
        return;
      }
      tbody.innerHTML = '';
      const scopeLabel = { All: 'ทุกประเภท', Membership: 'สมาชิกเท่านั้น', Daily: 'รายวัน/สินค้าเท่านั้น' };
      localCouponsArray.forEach(c => {
        const discountText = c.discountType === 'Fixed' ? Number(c.discountValue).toLocaleString('th-TH') + ' บาท' : c.discountValue + '%';

          : '<span class="text-[10px] bg-gray-800 text-gray-400 border border-gray-700 px-2 py-0.5 rounded-full font-bold">Inactive</span>';
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-white/[0.02]';
        tr.innerHTML =
          '<td class="py-3 pl-2 text-white font-bold font-mono">' + c.code + '</td>' +
          '<td class="py-3 text-red-400 font-mono">' + discountText + '</td>' +
          '<td class="py-3 text-gray-400">' + usageText + '</td>' +
          '<td class="py-3 text-gray-400 font-mono">' + (c.expiryDate || 'ไม่หมดอายุ') + '</td>' +
          '<td class="py-3 text-gray-400">' + (scopeLabel[c.applicableTo] || c.applicableTo) + '</td>' +
          '<td class="py-3">' + statusBadge + '</td>' +
          '<td class="py-3 text-right pr-2">' +
            '<button onclick="startEditCoupon(' + c.rowNumber + ')" class="text-gray-500 hover:text-red-400 cursor-pointer mr-3"><i class="fa-solid fa-pen"></i></button>' +
            '<button onclick="deleteCoupon(' + c.rowNumber + ')" class="text-gray-500 hover:text-red-500 cursor-pointer"><i class="fa-solid fa-trash-can"></i></button>' +
          '</td>';
        tbody.appendChild(tr);
      });

    function handleCouponSubmit() {
      const rowNum = document.getElementById('couponRowNumber').value;
      const data = {
        rowNumber: rowNum,
        code: document.getElementById('couponCode').value.trim().toUpperCase(),
        discountType: document.getElementById('couponDiscountType').value,
        discountValue: document.getElementById('couponDiscountValue').value,
        usageLimit: document.getElementById('couponUsageLimit').value,
        expiryDate: document.getElementById('couponExpiryDate').value,
        minPurchaseAmount: document.getElementById('couponMinPurchase').value,
        applicableTo: document.getElementById('couponApplicableTo').value,
        description: document.getElementById('couponDescription').value.trim(),
        status: 'Active',
        broadcastLine: document.getElementById('couponBroadcastLine').checked
      };
      if (!data.code) { alert('กรุณากรอกโค้ดคูปอง'); return; }

      const fn = rowNum ? 'updateCouponData' : 'addCouponData';
      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          if (res.success) { clearCouponForm(); loadCouponList(); }
        })
        .withFailureHandler(goToLoginIfExpired)
        [fn](data, SESSION_TOKEN);
    }

    function startEditCoupon(rowNumber) {
      const c = localCouponsArray.find(x => x.rowNumber === rowNumber);
      if (!c) return;
      document.getElementById('couponRowNumber').value = c.rowNumber;
      document.getElementById('couponCode').value = c.code;
      document.getElementById('couponDiscountType').value = c.discountType;
      document.getElementById('couponDiscountValue').value = c.discountValue;
      document.getElementById('couponUsageLimit').value = c.usageLimit === null ? '' : c.usageLimit;
      document.getElementById('couponExpiryDate').value = c.expiryDate || '';
      document.getElementById('couponMinPurchase').value = c.minPurchaseAmount || '';
      document.getElementById('couponApplicableTo').value = c.applicableTo;
      document.getElementById('couponDescription').value = c.description || '';
      document.getElementById('btnCouponSubmit').innerHTML = '<i class="fa-solid fa-check mr-1"></i>บันทึกการแก้ไข';
      document.getElementById('btnCouponCancel').classList.remove('hidden');
    }

    function populatePackageSelects() {
      const activePackages = localPackagesArray.filter(p => (p.status || 'Active') === 'Active');
      ['package', 'paymentPackageSelect'].forEach(id => {
        const sel = document.getElementById(id);
        if (!sel) return;
        const currentVal = sel.value;
        if (activePackages.length === 0) {
          sel.innerHTML = '<option value="">-- ยังไม่มีแพ็กเกจ กรุณาเพิ่มในหน้า Settings --</option>';
          return;
        }
        sel.innerHTML = '';
        activePackages.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.name;
          opt.innerText = p.name + ' (' + p.durationMonths + ' เดือน - ' + Number(p.price).toLocaleString('th-TH') + ' บาท)';
          sel.appendChild(opt);
        });
        if (currentVal && activePackages.some(p => p.name === currentVal)) sel.value = currentVal;
      });
      calculateExpiryDate();
    }

    function renderProductGrid() {
      const grid = document.getElementById('posProductGrid');
      if (!grid) return;
      const activeProducts = localProductsArray.filter(p => (p.status || 'Active') === 'Active');
      if (activeProducts.length === 0) {
        grid.innerHTML = '<p class="text-gray-600 text-xs text-center py-6 col-span-full">ยังไม่มีสินค้า — กด "จัดการสินค้า" เพื่อเพิ่ม</p>';
        return;
      }
      grid.innerHTML = '';
      activeProducts.forEach(p => {
        const tracksStock = p.stock !== null && typeof p.stock !== 'undefined';
        const outOfStock = tracksStock && p.stock <= 0;
        const lowStock = tracksStock && p.stock > 0 && p.stock <= (p.lowStockThreshold || 5);
        const stockBadge = tracksStock
          ? `<p class="text-[10px] mt-1 font-bold ${outOfStock ? 'text-red-500' : (lowStock ? 'text-yellow-500' : 'text-gray-500')}">${outOfStock ? 'สินค้าหมด' : 'คงเหลือ ' + p.stock + ' ชิ้น'}</p>`
          : '';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.disabled = outOfStock;
        btn.className = outOfStock
          ? 'bg-black border border-gray-900 rounded-xl p-3 text-left cursor-not-allowed opacity-40'
          : 'bg-black border border-gray-800 hover:border-red-500 rounded-xl p-3 text-left cursor-pointer transition-all';
        btn.innerHTML = `<p class="text-white text-xs font-bold truncate">${p.name}</p><p class="text-red-500 text-xs font-mono mt-1">${Number(p.price).toLocaleString('th-TH')} บาท</p>${stockBadge}`;
        if (!outOfStock) btn.onclick = () => addToCart(p);
        grid.appendChild(btn);
      });
    }

    function addToCart(product) {
      const tracksStock = product.stock !== null && typeof product.stock !== 'undefined';
      const existing = posCart.find(it => it.name === product.name && it.price === Number(product.price));
      const currentQtyInCart = existing ? existing.qty : 0;
      if (tracksStock && currentQtyInCart + 1 > product.stock) {
        alert('สินค้า "' + product.name + '" เหลือไม่พอ (คงเหลือ ' + product.stock + ' ชิ้น)');
        return;
      }
      if (existing) existing.qty += 1;
      else posCart.push({ name: product.name, price: Number(product.price), qty: 1 });
      renderCart();
    }

    function changeCartQty(index, delta) {
      posCart[index].qty += delta;
      if (posCart[index].qty <= 0) posCart.splice(index, 1);
      renderCart();
    }

    function formatYMD_(d) {
      const pad = n => n.toString().padStart(2, '0');
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function setReportPreset(type) {
      const today = new Date();
      let start = new Date(today);
      let end = new Date(today);

      if (type === 'today') {
        // start = end = today
      } else if (type === 'week') {
        start.setDate(start.getDate() - 6);
      } else if (type === 'month') {
        start = new Date(today.getFullYear(), today.getMonth(), 1);
      }

      document.getElementById('reportStartDate').value = formatYMD_(start);
      document.getElementById('reportEndDate').value = formatYMD_(end);
      loadRevenueReport();
    }

            alert('เกิดข้อผิดพลาด: ไม่สามารถโหลดข้อมูลรายงานได้ กรุณาลองใหม่');

          document.getElementById('reportMembershipTotal').innerText = Number(report.totals.membership || 0).toLocaleString('th-TH');

          document.getElementById('reportDayPassTotal').innerText = Number(report.totals.dayPass || 0).toLocaleString('th-TH');
          document.getElementById('reportProductsTotal').innerText = Number(report.totals.products || 0).toLocaleString('th-TH');
          document.getElementById('reportGrandTotal').innerText = Number(report.totals.grandTotal || 0).toLocaleString('th-TH');
          document.getElementById('reportDailyCount').innerText = report.totals.dailyCount || 0;
          document.getElementById('reportExpenseTotal').innerText = Number(report.totals.expenses || 0).toLocaleString('th-TH');
          document.getElementById('reportNetProfit').innerText = Number(report.totals.netProfit || 0).toLocaleString('th-TH');

          // แยก try/catch แต่ละส่วน กันไม่ให้ส่วนหนึ่งพังแล้วทำให้ส่วนอื่นไม่แสดงผลตามไปด้วย

    function renderRevenueChart(breakdown) {
      const canvasEl = document.getElementById('revenueChart');
      if (!canvasEl) return;

      const labels = breakdown.map(d => (d.date || '').slice(5)); // MM-DD
      const membership = breakdown.map(d => d.membership || 0);
      const dayPass = breakdown.map(d => d.dayPass || 0);
      const products = breakdown.map(d => d.products || 0);

      const ctx = canvasEl.getContext('2d');
      if (revenueChartInstance) { revenueChartInstance.destroy(); revenueChartInstance = null; }

      revenueChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: 'สมาชิกรายเดือน', data: membership, backgroundColor: 'rgba(220, 38, 38, 0.7)', stack: 'rev' },
            { label: 'ค่าเข้ารายวัน', data: dayPass, backgroundColor: 'rgba(234, 179, 8, 0.7)', stack: 'rev' },
            { label: 'ขายสินค้า', data: products, backgroundColor: 'rgba(34, 197, 94, 0.7)', stack: 'rev' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: { legend: { labels: { color: '#9CA3AF', font: { family: 'Prompt' } } } },
          scales: {
            x: { stacked: true, ticks: { color: '#6B7280' }, grid: { color: '#1a1a1a' } },
            y: { stacked: true, ticks: { color: '#6B7280' }, grid: { color: '#1a1a1a' } }
          }
        }
      });
    }

    function saveRevenueRowEdit(dateStr) {

    let dayPassQty = { student: 0, adult: 0 };

    function changeDayPassQty(type, delta) {
      dayPassQty[type] = Math.max(0, dayPassQty[type] + delta);
      const labelId = type === 'student' ? 'dayPassQtyStudent' : 'dayPassQtyAdult';
      document.getElementById(labelId).innerText = dayPassQty[type];
      renderCart();
    }

    function removeCartItem(index) {
      posCart.splice(index, 1);
      renderCart();
    }

    let appliedPosCoupon = null; // { code, rowNumber, discountAmount }

    function getPosSubtotal() {
      const studentPrice = parseFloat(document.getElementById('dayPassPriceStudent').value) || 0;
      const adultPrice = parseFloat(document.getElementById('dayPassPriceAdult').value) || 0;
      let subtotal = (dayPassQty.student * studentPrice) + (dayPassQty.adult * adultPrice);
      posCart.forEach(it => { subtotal += it.price * it.qty; });
      return subtotal;
    }

    // ยอดค่าเข้ายิมอย่างเดียว (ไม่รวมสินค้า/เครื่องดื่ม) - ใช้เป็นฐานคำนวณส่วนลดเท่านั้น
    function getDayPassSubtotal() {
      const studentPrice = parseFloat(document.getElementById('dayPassPriceStudent').value) || 0;
      const adultPrice = parseFloat(document.getElementById('dayPassPriceAdult').value) || 0;
      return (dayPassQty.student * studentPrice) + (dayPassQty.adult * adultPrice);
    }

    function applyPosCoupon() {
      const code = document.getElementById('posCouponCode').value.trim().toUpperCase();
      const msg = document.getElementById('posCouponMsg');
      if (!code) { msg.innerText = ''; appliedPosCoupon = null; renderCart(); return; }
      const subtotal = getDayPassSubtotal();
      if (subtotal <= 0) { msg.innerText = 'ส่วนลดใช้ได้กับค่าเข้ายิมเท่านั้น กรุณาเลือกค่าเข้ายิมก่อนใช้คูปอง'; msg.className = 'text-xs mb-4 -mt-2 text-yellow-400'; return; }

      google.script.run
        .withSuccessHandler(res => {
          if (res.valid) {
            appliedPosCoupon = { code: res.code, rowNumber: res.rowNumber, discountAmount: res.discountAmount };
            msg.innerText = res.message;
            msg.className = 'text-xs mb-4 -mt-2 text-green-400';
          } else {
            appliedPosCoupon = null;
            msg.innerText = res.message;
            msg.className = 'text-xs mb-4 -mt-2 text-red-400';
          }
          renderCart();
        })
        .withFailureHandler(goToLoginIfExpired)
        .previewCouponDiscount(code, subtotal, 'daily', SESSION_TOKEN);
    }

    function resetPosCoupon() {
      appliedPosCoupon = null;
      document.getElementById('posCouponCode').value = '';
      document.getElementById('posCouponMsg').innerText = '';
    }

    let manualDiscount = null; // { type: 'Percent'|'Fixed', value, discountAmount }

    function applyManualDiscount() {
      const type = document.getElementById('manualDiscountType').value;
      const value = parseFloat(document.getElementById('manualDiscountValue').value);
      const msg = document.getElementById('manualDiscountMsg');

      if (!value || value <= 0) {
        manualDiscount = null;
        msg.innerText = '';
        renderCart();
        return;
      }

      const subtotal = getDayPassSubtotal();
      if (subtotal <= 0) { msg.innerText = 'ส่วนลดใช้ได้กับค่าเข้ายิมเท่านั้น กรุณาเลือกค่าเข้ายิมก่อนใส่ส่วนลด'; msg.className = 'text-xs -mt-1 text-yellow-400'; return; }

      let discountAmount = type === 'Fixed' ? value : Math.round(subtotal * (value / 100) * 100) / 100;
      if (discountAmount > subtotal) discountAmount = subtotal;

      manualDiscount = { type, value, discountAmount };
      msg.innerText = '✅ ใช้ส่วนลดพิเศษแล้ว: -' + discountAmount.toLocaleString('th-TH') + ' บาท';
      msg.className = 'text-xs -mt-1 text-green-400';
      renderCart();
    }

    function resetManualDiscount() {
      manualDiscount = null;
      document.getElementById('manualDiscountValue').value = '';
      document.getElementById('manualDiscountMsg').innerText = '';
    }

    // ค่าเทรนเนอร์ฟรีแลนซ์ - เก็บแทนให้ในบิลเดียวกัน ไม่นับเป็นรายรับของยิม
    let trainerFees = []; // [{ name, amount }, ...]

    function addTrainerFee() {
      const nameInput = document.getElementById('trainerFeeName');
      const amountInput = document.getElementById('trainerFeeAmount');
      const name = nameInput.value.trim();
      const amount = parseFloat(amountInput.value);

      if (!name) { alert('กรุณากรอกชื่อเทรนเนอร์'); return; }
      if (!amount || amount <= 0) { alert('กรุณากรอกจำนวนเงินให้ถูกต้อง'); return; }

      trainerFees.push({ name, amount });
      nameInput.value = '';
      amountInput.value = '';
      renderTrainerFeeList();
      renderCart();
    }

    function removeTrainerFee(index) {
      trainerFees.splice(index, 1);
      renderTrainerFeeList();
      renderCart();
    }

    function renderTrainerFeeList() {
      const el = document.getElementById('trainerFeeList');
      if (trainerFees.length === 0) { el.innerHTML = ''; return; }
      el.innerHTML = trainerFees.map((tf, idx) => `
        <div class="flex justify-between items-center bg-blue-950/20 border border-blue-900 rounded-lg p-2">
          <span class="text-blue-300 text-xs font-bold">${tf.name}</span>
          <div class="flex items-center gap-2">
            <span class="text-blue-400 font-mono text-xs">${tf.amount.toLocaleString('th-TH')} บาท</span>
            <button onclick="removeTrainerFee(${idx})" class="text-gray-600 hover:text-red-400 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>
      `).join('');
    }

    function resetTrainerFees() {
      trainerFees = [];
      renderTrainerFeeList();
    }

    function renderCart() {
      const listEl = document.getElementById('posCartList');
      const totalEl = document.getElementById('posTotalDisplay');
      const studentPrice = parseFloat(document.getElementById('dayPassPriceStudent').value) || 0;
      const adultPrice = parseFloat(document.getElementById('dayPassPriceAdult').value) || 0;

      let html = '';
      let total = 0;
      let hasAnyItem = posCart.length > 0 || trainerFees.length > 0;

      if (dayPassQty.student > 0) {
        const lineTotal = studentPrice * dayPassQty.student;
        total += lineTotal;
        hasAnyItem = true;
        html += `
          <div class="flex justify-between items-center bg-black/40 border border-gray-800 rounded-xl p-3">
            <span class="text-white text-xs font-bold"><i class="fa-solid fa-person-walking mr-2 text-red-500"></i>ค่าเข้ายิมวันนี้ (นักเรียน/นักศึกษา) x${dayPassQty.student}</span>
            <span class="text-red-400 font-mono font-bold text-xs">${lineTotal.toLocaleString('th-TH')} บาท</span>
          </div>`;
      }

      if (dayPassQty.adult > 0) {
        const lineTotal = adultPrice * dayPassQty.adult;
        total += lineTotal;
        hasAnyItem = true;
        html += `
          <div class="flex justify-between items-center bg-black/40 border border-gray-800 rounded-xl p-3">
            <span class="text-white text-xs font-bold"><i class="fa-solid fa-person-walking mr-2 text-red-500"></i>ค่าเข้ายิมวันนี้ (ผู้ใหญ่) x${dayPassQty.adult}</span>
            <span class="text-red-400 font-mono font-bold text-xs">${lineTotal.toLocaleString('th-TH')} บาท</span>
          </div>`;
      }

      posCart.forEach((it, idx) => {
        const lineTotal = it.price * it.qty;
        total += lineTotal;
        html += `
          <div class="flex justify-between items-center bg-black/40 border border-gray-800 rounded-xl p-3">
            <div class="flex-1 min-w-0">
              <p class="text-white text-xs font-bold truncate">${it.name}</p>
              <p class="text-gray-500 text-[10px] font-mono">${it.price.toLocaleString('th-TH')} บาท/ชิ้น</p>
            </div>
            <div class="flex items-center gap-2 mx-3">
              <button onclick="changeCartQty(${idx}, -1)" class="w-6 h-6 rounded-md bg-gray-800 hover:bg-gray-700 text-white text-xs cursor-pointer">−</button>
              <span class="text-white text-xs font-bold w-5 text-center">${it.qty}</span>
              <button onclick="changeCartQty(${idx}, 1)" class="w-6 h-6 rounded-md bg-gray-800 hover:bg-gray-700 text-white text-xs cursor-pointer">+</button>
            </div>
            <span class="text-red-400 font-mono font-bold text-xs w-20 text-right">${lineTotal.toLocaleString('th-TH')} บาท</span>
            <button onclick="removeCartItem(${idx})" class="text-gray-600 hover:text-red-400 ml-2 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
          </div>`;
      });

      if (appliedPosCoupon) {
        total -= appliedPosCoupon.discountAmount;
        html += `
          <div class="flex justify-between items-center bg-green-950/30 border border-green-800 rounded-xl p-3">
            <span class="text-green-400 text-xs font-bold"><i class="fa-solid fa-ticket mr-2"></i>ส่วนลดคูปอง (${appliedPosCoupon.code})</span>
            <span class="text-green-400 font-mono font-bold text-xs">-${appliedPosCoupon.discountAmount.toLocaleString('th-TH')} บาท</span>
            <button onclick="resetPosCoupon(); renderCart();" class="text-gray-600 hover:text-red-400 ml-2 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
          </div>`;
      }

      if (manualDiscount) {
        total -= manualDiscount.discountAmount;
        const label = manualDiscount.type === 'Fixed' ? manualDiscount.value.toLocaleString('th-TH') + ' บาท' : manualDiscount.value + '%';
        html += `
          <div class="flex justify-between items-center bg-blue-950/30 border border-blue-800 rounded-xl p-3">
            <span class="text-blue-400 text-xs font-bold"><i class="fa-solid fa-tag mr-2"></i>ส่วนลดพิเศษ (${label})</span>
            <span class="text-blue-400 font-mono font-bold text-xs">-${manualDiscount.discountAmount.toLocaleString('th-TH')} บาท</span>
            <button onclick="resetManualDiscount(); renderCart();" class="text-gray-600 hover:text-red-400 ml-2 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
          </div>`;
      }

      trainerFees.forEach((tf, idx) => {
        total += tf.amount;
        html += `
          <div class="flex justify-between items-center bg-black/40 border border-blue-900/50 rounded-xl p-3">
            <span class="text-blue-300 text-xs font-bold"><i class="fa-solid fa-person-running mr-2"></i>ค่าเทรนเนอร์: ${tf.name}</span>
            <span class="text-blue-300 font-mono font-bold text-xs">${tf.amount.toLocaleString('th-TH')} บาท</span>
            <button onclick="removeTrainerFee(${idx}); renderCart();" class="text-gray-600 hover:text-red-400 ml-2 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
          </div>`;
      });

      if (!hasAnyItem) {
        listEl.innerHTML = '<p class="text-gray-600 text-xs text-center py-4">ยังไม่มีรายการ เลือกค่าเข้ายิมหรือสินค้าด้านบน</p>';
      } else {
        listEl.innerHTML = html;
      }

      totalEl.innerText = Math.max(0, total).toLocaleString('th-TH') + ' บาท';
    }

    function getCustomersData() {
      const rows = document.querySelectorAll('#customersList > div');
      const names = [], phones = [];
      rows.forEach(row => {
        const n = row.querySelector('.custName').value.trim();
        const p = row.querySelector('.custPhone').value.trim();

    function submitDailyPayment() {
      const { names, phones } = getCustomersData();
      const studentPrice = document.getElementById('dayPassPriceStudent').value;
      const adultPrice = document.getElementById('dayPassPriceAdult').value;

      if (names.length === 0) { alert('กรุณากรอกชื่อลูกค้าอย่างน้อย 1 คน'); return; }
      const hasDayPass = dayPassQty.student > 0 || dayPassQty.adult > 0;
      if (!hasDayPass && posCart.length === 0) { alert('กรุณาเลือกค่าเข้ายิมหรือสินค้าอย่างน้อย 1 รายการ'); return; }

      const dayPassItems = [];
      if (dayPassQty.student > 0) dayPassItems.push({ type: 'student', qty: dayPassQty.student, price: studentPrice });
      if (dayPassQty.adult > 0) dayPassItems.push({ type: 'adult', qty: dayPassQty.adult, price: adultPrice });

      const btn = document.getElementById('btnSubmitDaily');
      btn.disabled = true; btn.innerText = 'กำลังบันทึก...';

      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          btn.disabled = false; btn.innerText = 'รับชำระเงิน & ออกใบเสร็จ';
          if (res.success) {
            resetCustomersList();
            resetDayPassQty();
            resetPosCoupon();
            resetManualDiscount();
            resetTrainerFees();
            setPosPaymentMethod('cash');
            posCart = [];
            renderCart();
            loadDailyPaymentLogs();
            document.getElementById('pendingMembershipBanner').classList.add('hidden');
            if (res.receiptNo && confirm('รับชำระเงินสำเร็จ! ต้องการพิมพ์ใบเสร็จ (' + res.receiptNo + ') เลยหรือไม่?')) {
              printDailyReceipt(res.receiptNo);
            }
          }
        })
        .withFailureHandler(err => { goToLoginIfExpired(err); btn.disabled = false; btn.innerText = 'รับชำระเงิน & ออกใบเสร็จ'; })
        .processDailyPayment({
          customerName: names.join(', '),
          phone: phones.join(', '),
          dayPassItems: dayPassItems,
          items: posCart,
          couponCode: appliedPosCoupon ? appliedPosCoupon.code : '',
          manualDiscountType: manualDiscount ? manualDiscount.type : '',
          manualDiscountValue: manualDiscount ? manualDiscount.value : 0,
          trainerFees: trainerFees,
          paymentMethod: posPaymentMethod
        }, SESSION_TOKEN);
    }

      const tbody = document.getElementById('dailyPaymentLogsTableBody');
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-gray-600">กำลังดึงข้อมูล...</td></tr>';

      google.script.run
        .withSuccessHandler(logs => {
          if(!logs || logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-gray-600">ยังไม่มีข้อมูล</td></tr>';
            return;
          }
          tbody.innerHTML = '';
          logs.forEach(log => {
            const isRefunded = log.refundStatus === 'Refunded';
            const tr = document.createElement('tr');
            tr.className = "hover:bg-white/[0.02] transition-colors" + (isRefunded ? " opacity-50" : "");
            const statusBadge = isRefunded
              ? '<span class="text-[10px] bg-red-950 text-red-400 border border-red-800 px-2 py-0.5 rounded-full font-bold">คืนเงินแล้ว</span>'
              : '<span class="text-[10px] bg-green-950 text-green-400 border border-green-800 px-2 py-0.5 rounded-full font-bold">ปกติ</span>';

              `<button onclick="voidDailyPaymentUI('${log.receiptNo}')" title="ยกเลิก/คืนเงิน" class="text-gray-500 hover:text-red-500 cursor-pointer ml-2"><i class="fa-solid fa-rotate-left"></i></button>`;
            const isTransfer = log.paymentMethod === 'โอนเงิน';
            const paymentBadge = `<button onclick="editDailyPaymentMethodUI('${log.receiptNo}', '${isTransfer ? 'cash' : 'transfer'}')" title="กดเพื่อสลับวิธีชำระเงิน" class="text-[10px] px-2 py-0.5 rounded-full font-bold cursor-pointer border ${isTransfer ? 'bg-blue-950 text-blue-400 border-blue-800' : 'bg-gray-800 text-gray-300 border-gray-700'}"><i class="fa-solid ${isTransfer ? 'fa-mobile-screen-button' : 'fa-money-bill-wave'} mr-1"></i>${log.paymentMethod || 'เงินสด'}</button>`;
            tr.innerHTML = `
              <td class="py-3 pl-2 font-mono text-gray-400">${log.timestamp}</td>
              <td class="py-3 font-bold text-white">${log.customerName}</td>
              <td class="py-3 text-gray-400 max-w-[220px] truncate" title="${log.itemSummary || ''}">${log.itemSummary || '-'}</td>
              <td class="py-3 text-green-400 font-bold">${Number(log.amount).toLocaleString('th-TH')} บาท</td>
              <td class="py-3">${statusBadge}</td>
              <td class="py-3">${paymentBadge}</td>
              <td class="py-3 pr-2 text-right whitespace-nowrap">
                ${log.receiptNo ? `<button onclick="printDailyReceipt('${log.receiptNo}')" class="bg-red-950 hover:bg-red-900 text-red-400 border border-red-800 px-2.5 py-1 rounded-lg text-[10px] font-bold cursor-pointer whitespace-nowrap"><i class="fa-solid fa-file-invoice mr-1"></i>${log.receiptNo}</button>` : '-'}
                ${voidBtn}
              </td>
            `;
            tbody.appendChild(tr);
          });
        })
        .withFailureHandler(goToLoginIfExpired)
        .getDailyPaymentLogs(SESSION_TOKEN);
    }

              '<button onclick="adjustProductStockUI(' + p.rowNumber + ', null)" title="เติมสต็อกจำนวนมาก" class="text-gray-500 hover:text-red-400 cursor-pointer text-[10px] ml-1"><i class="fa-solid fa-boxes-stacked"></i></button>' +
            '</div>';
        }

    function adjustProductStockUI(rowNumber, delta) {
      if (delta === null) {
        const input = prompt('ระบุจำนวนที่ต้องการเติม/ปรับ (ใส่ค่าติดลบเพื่อลด เช่น -3):');
        if (input === null || input.trim() === '') return;
        delta = parseInt(input);
        if (isNaN(delta)) { alert('กรุณากรอกตัวเลข'); return; }
      }
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) loadProductList();
          else alert(res.message);
        })
        .withFailureHandler(goToLoginIfExpired)
        .adjustProductStock(rowNumber, delta, SESSION_TOKEN);
    }

    function handleProductSubmit() {
      const rowNum = document.getElementById('productRowNumber').value;
      const stockVal = document.getElementById('productStock').value.trim();
      const data = {
        rowNumber: rowNum,
        name: document.getElementById('productName').value.trim(),

          if (res.success) { clearProductForm(); loadProductList(); }

    function handleSlipDrop(e) { e.preventDefault(); processImageFile(e.dataTransfer.files[0]); }
    function handleFileSelect(e) { processImageFile(e.target.files[0]); }

    function processImageFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const statusText = document.getElementById('dropStatusText');
      const uploadIcon = document.getElementById('uploadIcon');
      statusText.innerHTML = "กำลังอ่านรหัส...";
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
          canvas.width = img.width; canvas.height = img.height;
          ctx.drawImage(img, 0, 0, img.width, img.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code) {
            document.getElementById('qrDecodedData').value = code.data;
            statusText.innerHTML = "✅ สำเร็จ!"; uploadIcon.className = "fa-solid fa-circle-check text-4xl text-green-500";
            document.getElementById('btnSubmitPayment').disabled = false;
            document.getElementById('btnSubmitPayment').className = "w-full bg-red-600 hover:bg-red-500 text-white font-black py-4 rounded-xl text-sm cursor-pointer";
          } else { statusText.innerHTML = "❌ ไม่พบ QR Code"; resetPaymentButton(); }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

            if (res.receiptNo && confirm('ต่ออายุสำเร็จ! ต้องการพิมพ์ใบเสร็จรับเงิน (' + res.receiptNo + ') ให้ลูกค้าเลยหรือไม่?')) {

    function loadPaymentLogs() {
      const tbody = document.getElementById('paymentLogsTableBody');
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-6 text-gray-600">กำลังดึงข้อมูล...</td></tr>';

      google.script.run
        .withSuccessHandler(logs => {
          localPaymentLogsArray = logs;
          if(!logs || logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-6 text-gray-600">ไม่พบประวัติการชำระเงิน</td></tr>';
            return;
          }
          tbody.innerHTML = '';
          logs.forEach(log => {
            const isRefunded = log.refundStatus === 'Refunded';
            const tr = document.createElement('tr');
            tr.className = "hover:bg-white/[0.02] transition-colors" + (isRefunded ? " opacity-50" : "");
            const statusBadge = isRefunded
              ? '<span class="text-[10px] bg-red-950 text-red-400 border border-red-800 px-2 py-0.5 rounded-full font-bold">คืนเงินแล้ว</span>'
              : '<span class="text-[10px] bg-green-950 text-green-400 border border-green-800 px-2 py-0.5 rounded-full font-bold">ปกติ</span>';
            // รายการที่ฝังอยู่ในบิล POS ลูกค้ารายวัน ต้องใช้ฟังก์ชันคนละชุด (อ้างอิงชีท DailyPayments แทน Payments)
            const voidFn = log.bundledInDailyBill ? 'voidDailyPaymentUI' : 'voidMembershipPaymentUI';
            const printFn = log.bundledInDailyBill ? 'printDailyReceipt' : 'printReceipt';
            const editMethodFn = log.bundledInDailyBill ? 'editDailyPaymentMethodUI' : 'editMembershipPaymentMethodUI';
            const voidBtn = isRefunded ? '' :
              `<button onclick="${voidFn}('${log.receiptNo}')" title="ยกเลิก/คืนเงิน" class="text-gray-500 hover:text-red-500 cursor-pointer ml-2"><i class="fa-solid fa-rotate-left"></i></button>`;
            const isTransfer = log.paymentMethod === 'โอนเงิน';
            const paymentBadge = `<button onclick="${editMethodFn}('${log.receiptNo}', '${isTransfer ? 'cash' : 'transfer'}')" title="กดเพื่อสลับวิธีชำระเงิน" class="text-[10px] px-2 py-0.5 rounded-full font-bold cursor-pointer border ${isTransfer ? 'bg-blue-950 text-blue-400 border-blue-800' : 'bg-gray-800 text-gray-300 border-gray-700'}"><i class="fa-solid ${isTransfer ? 'fa-mobile-screen-button' : 'fa-money-bill-wave'} mr-1"></i>${log.paymentMethod || 'เงินสด'}</button>`;
            const bundledMark = log.bundledInDailyBill ? ' <span class="text-[9px] bg-purple-950 text-purple-400 border border-purple-800 px-1.5 py-0.5 rounded-full font-bold" title="ค่าสมัครนี้ถูกรวมชำระในบิล POS ลูกค้ารายวัน ไม่ได้จ่ายแยก">รวมใน POS</span>' : '';
            tr.innerHTML = `
              <td class="py-3 pl-2 font-mono text-gray-400">${log.timestamp}</td>
              <td class="py-3 font-bold text-white">${log.memberName}${bundledMark}</td>
              <td class="py-3 text-red-400 font-medium">${log.package}</td>
              <td class="py-3 font-mono text-gray-500 max-w-[200px] truncate" title="${log.qrData}">${log.qrData || '-'}</td>
              <td class="py-3 font-mono text-green-400 font-bold">${log.newExpiry || '-'}</td>
              <td class="py-3">${statusBadge}</td>
              <td class="py-3">${paymentBadge}</td>
              <td class="py-3 pr-2 text-right whitespace-nowrap">
                ${log.receiptNo ? `<button onclick="${printFn}('${log.receiptNo}')" class="bg-red-950 hover:bg-red-900 text-red-400 border border-red-800 px-2.5 py-1 rounded-lg text-[10px] font-bold cursor-pointer whitespace-nowrap"><i class="fa-solid fa-file-invoice mr-1"></i>${log.receiptNo}</button>` : '-'}
                ${voidBtn}
              </td>
            `;
            tbody.appendChild(tr);
          });
        })
        .withFailureHandler(goToLoginIfExpired)
        .getPaymentLogs(SESSION_TOKEN);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const rowNum = document.getElementById('rowNumber').value;
      const data = {
        rowNumber: rowNum, 
        fullName: document.getElementById('fullName').value, 
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value, 
        package: document.getElementById('package').value,
        startDate: document.getElementById('startDate').value, 
        expiryDate: document.getElementById('expiryDate').value,
        fingerprintId: document.getElementById('fingerprintId').value, 
        status: document.getElementById('status').value,
        pin: document.getElementById('memberPin').value,
        amount: document.getElementById('memberChargeAmount').value,
        dob: document.getElementById('memberDob').value,
        couponCode: document.getElementById('memberCouponCode').value.trim(),
        paymentMethod: newMemberPaymentMethod
      };
      if (rowNum) {
        google.script.run
          .withSuccessHandler(res => { alert(res.message); clearEditMode(); loadMemberList(); })
          .withFailureHandler(goToLoginIfExpired)
          .updateMemberData(data, SESSION_TOKEN);
      } else if (membershipAddOnMode) {
        data.deferPayment = true;
        google.script.run
          .withSuccessHandler(res => {
            if (!res.success) { alert(res.message); return; }
            const price = (typeof res.chargeAmount === 'number') ? res.chargeAmount : (parseFloat(document.getElementById('memberChargeAmount').value) || 0);
            posCart.push({ name: 'สมัครสมาชิกรายเดือน - ' + data.package + ' (' + data.fullName + ')', price: price, qty: 1 });
            document.getElementById('memberForm').reset(); initForm(); loadMemberList();
            finishMembershipAddOn();
            switchSection('payments');
            document.getElementById('pendingMembershipBanner').classList.remove('hidden');
            renderCart();
            alert('เพิ่มแพ็กเกจสมัครสมาชิกของ "' + data.fullName + '" ลงในบิลแล้ว! ตรวจสอบรายการแล้วกดรับชำระเงินด้านล่าง');
          })
          .withFailureHandler(goToLoginIfExpired)
          .saveMemberData(data, SESSION_TOKEN);
      } else {
        google.script.run
          .withSuccessHandler(res => {
            alert(res.message);
            document.getElementById('memberForm').reset(); initForm(); loadMemberList();
            if (res.receiptNo && confirm('ลงทะเบียนและรับชำระเงินสำเร็จ! ต้องการพิมพ์ใบเสร็จ (' + res.receiptNo + ') เลยหรือไม่?')) {
              printReceipt(res.receiptNo);
            }
          })
          .withFailureHandler(goToLoginIfExpired)
          .saveMemberData(data, SESSION_TOKEN);
      }
    }

    // ==========================================
    // 🖐️ ลงทะเบียนลายนิ้วมือจากหน้าเว็บ (ไม่ต้องเปิด CMD เอง)
    // ==========================================
    let enrollPollInterval = null;

    function manualCheckInUI(rowNumber, memberName) {
      if (!confirm('ยืนยันเช็คอินให้ "' + memberName + '" ด้วยมือ?\n\nใช้ตอนเครื่องสแกนลายนิ้วมือหน้าประตูใช้งานไม่ได้เท่านั้น')) return;
      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          if (res.success) { loadMemberList(); renderCheckinList(); }
        })
        .withFailureHandler(goToLoginIfExpired)
        .manualCheckIn(rowNumber, SESSION_TOKEN);
    }

    // ==========================================
    // ✅ หน้าเช็คอินลูกค้าแบบง่าย (ไว้ใช้เวลาเครื่องสแกนลายนิ้วมือใช้งานไม่ได้)
    // ==========================================
    function renderCheckinList() {
      const container = document.getElementById('checkinListContainer');
      const searchTerm = (document.getElementById('checkinSearchBar').value || '').trim().toLowerCase();
      if (!container) return;

      if (!localMembersArray || localMembersArray.length === 0) {
        container.innerHTML = '<p class="text-gray-600 text-xs text-center py-8">กำลังโหลดข้อมูลสมาชิก...</p>';
        return;
      }

      let filtered = localMembersArray;
      if (searchTerm) {
        filtered = localMembersArray.filter(m => (m.fullName || '').toLowerCase().includes(searchTerm) || (m.phone || '').includes(searchTerm));
      }

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-gray-600 text-xs text-center py-8">ไม่พบสมาชิกที่ค้นหา</p>';
        return;
      }

      // ถ้ายังไม่ได้พิมพ์ค้นหา แสดงแค่ 15 คนแรกพอ กันหน้ายาวเกินไป
      const displayList = searchTerm ? filtered : filtered.slice(0, 15);

      container.innerHTML = displayList.map(member => {
        const isActive = member.status === 'Active';
        const statusBadge = isActive
          ? '<span class="text-[10px] bg-green-950 text-green-400 border border-green-800 px-2.5 py-1 rounded-full font-bold uppercase">Active</span>'
          : `<span class="text-[10px] bg-gray-800 text-gray-400 border border-gray-700 px-2.5 py-1 rounded-full font-bold uppercase">${member.status}</span>`;
        return `
          <div class="glass-card p-4 md:p-5 rounded-2xl flex items-center justify-between gap-4">
            <div class="min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <h4 class="text-white font-bold text-base truncate">${member.fullName}</h4>
                ${statusBadge}
              </div>
              <p class="text-gray-500 text-xs">${member.package} • ${member.phone}</p>
              <p class="text-gray-600 text-[11px] mt-0.5"><i class="fa-solid fa-calendar-days mr-1"></i>หมดอายุ: <span class="font-mono">${member.expiryDate}</span> <span class="mx-1">•</span><i class="fa-solid fa-dumbbell mr-1"></i>เข้าแล้ว ${member.checkInCount} ครั้ง</p>
            </div>
            <button onclick="manualCheckInUI(${member.rowNumber}, '${member.fullName.replace(/'/g, "\\'")}')" class="shrink-0 bg-green-600 hover:bg-green-500 text-white font-black py-3 px-5 rounded-xl text-xs uppercase cursor-pointer flex items-center gap-2">
              <i class="fa-solid fa-check text-sm"></i> เช็คอิน
            </button>
          </div>
        `;
      }).join('');
    }

    function openEnrollFingerprintModal(rowNumber, memberName) {
      document.getElementById('enrollWaitingState').classList.remove('hidden');
      document.getElementById('enrollSuccessState').classList.add('hidden');
      document.getElementById('enrollFailedState').classList.add('hidden');
      document.getElementById('btnCancelEnroll').classList.remove('hidden');
      document.getElementById('enrollMemberNameText').innerText = memberName;
      document.getElementById('enrollFingerprintModal').classList.remove('hidden');

      google.script.run
        .withSuccessHandler(res => {
          if (!res.success) {
            alert(res.message);
            closeEnrollFingerprintModal();
            return;
          }
          if (enrollPollInterval) clearInterval(enrollPollInterval);
          enrollPollInterval = setInterval(checkEnrollmentStatus, 2000);
        })
        .withFailureHandler(err => { goToLoginIfExpired(err); closeEnrollFingerprintModal(); })
        .requestFingerprintEnrollment(rowNumber, SESSION_TOKEN);
    }

    function checkEnrollmentStatus() {
      google.script.run
        .withSuccessHandler(res => {
          if (res.status === 'done') {
            clearInterval(enrollPollInterval);
            enrollPollInterval = null;
            document.getElementById('enrollWaitingState').classList.add('hidden');
            document.getElementById('enrollSuccessState').classList.remove('hidden');
            document.getElementById('enrollSuccessText').innerText = 'รหัสลายนิ้วมือ: ' + res.fingerprintId;
            document.getElementById('btnCancelEnroll').innerText = 'ปิด';
            loadMemberList();
          } else if (res.status === 'failed') {
            clearInterval(enrollPollInterval);
            enrollPollInterval = null;
            document.getElementById('enrollWaitingState').classList.add('hidden');
            document.getElementById('enrollFailedState').classList.remove('hidden');
            document.getElementById('enrollFailedText').innerText = res.errorMessage || 'ไม่ทราบสาเหตุ ลองใหม่อีกครั้ง';
            document.getElementById('btnCancelEnroll').innerText = 'ปิด';
          }
          // ถ้า status ยัง 'waiting' ก็ไม่ต้องทำอะไร รอ poll รอบถัดไป
        })
        .withFailureHandler(() => { /* เงียบไว้ก่อน ไม่ต้อง logout ระหว่าง polling เผื่อเน็ตสะดุดชั่วคราว */ })
        .getEnrollmentStatus(SESSION_TOKEN);
    }

    function cancelEnrollFingerprint() {
      if (enrollPollInterval) { clearInterval(enrollPollInterval); enrollPollInterval = null; }
      google.script.run
        .withFailureHandler(() => {})
        .cancelFingerprintEnrollmentRequest(SESSION_TOKEN);
      closeEnrollFingerprintModal();
    }

    function closeEnrollFingerprintModal() {
      if (enrollPollInterval) { clearInterval(enrollPollInterval); enrollPollInterval = null; }
      document.getElementById('enrollFingerprintModal').classList.add('hidden');
      document.getElementById('btnCancelEnroll').innerText = 'ยกเลิก';
    }

      document.getElementById('startDate').value = member.startDate;
      document.getElementById('expiryDate').value = member.expiryDate;

    function renderHistoryBookings(bookings) {

        else if (b.status === 'Completed') badgeClass = 'bg-blue-950 text-blue-400 border-blue-800';
        const row = document.createElement('div');

      google.script.run
        .withSuccessHandler(list => {
          localMembersArray = list;

          currentPage = 1;
          renderListCards();

          populateAdminBookMemberSelect();

        .getMemberList(SESSION_TOKEN);

    function filterMemberList() {
      const query = document.getElementById('searchBar').value.toLowerCase().trim();
      currentFilteredList = localMembersArray.filter(m =>
        m.fullName.toLowerCase().includes(query) ||
        m.phone.includes(query) ||
        (m.fingerprintId || '').toString().toLowerCase().includes(query)
      );
      currentPage = 1;
      renderListCards();
    }

    function changePage(delta) {
      currentPage += delta;
      renderListCards();
    }

    function renderListCards() {
      const container = document.getElementById('memberListContainer');
      const array = currentFilteredList;

      if (!array || array.length === 0) {
        container.innerHTML = '<p class="text-gray-600 text-xs text-center py-10">ไม่พบข้อมูล</p>';
        return;
      }

      const totalPages = Math.max(1, Math.ceil(array.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      const startIdx = (currentPage - 1) * PAGE_SIZE;
      const pageItems = array.slice(startIdx, startIdx + PAGE_SIZE);

      container.innerHTML = '';
      const today = new Date();

      pageItems.forEach(member => {
        const expDate = new Date(member.expiryDate);
        const daysLeft = Math.ceil((expDate.getTime() - today.getTime()) / (1000 * 3600 * 24));
        let badge = '', borderStyle = 'border-gray-800 hover:border-red-500/50', expiryTextColor = 'text-gray-400';

        if (member.status === 'Suspended') {
          badge = `<span class="text-[10px] bg-yellow-950 text-yellow-400 border border-yellow-800 px-2 py-0.5 rounded-full font-bold">Freeze</span>`;
          borderStyle = 'border-yellow-700 bg-yellow-950/10 hover:border-yellow-500'; expiryTextColor = 'text-yellow-400/70';
        } else if (member.status === 'Inactive') {
          badge = `<span class="text-[10px] bg-gray-800 text-gray-400 border border-gray-700 px-2 py-0.5 rounded-full font-bold">Inactive</span>`;
          borderStyle = 'border-gray-800 bg-gray-900/40 opacity-50 hover:opacity-100';
        } else if (daysLeft < 0) {
          badge = `<span class="text-[10px] bg-red-950 text-red-400 border border-red-800 px-2 py-0.5 rounded-full font-bold">Expired</span>`;
          borderStyle = 'border-red-900 bg-red-950/10 hover:border-red-500'; expiryTextColor = 'text-red-400 font-bold';
        } else if (daysLeft <= 7) {
          badge = `<span class="text-[10px] bg-red-950 text-red-400 border border-red-800 px-2 py-0.5 rounded-full font-bold">ใกล้หมดอายุ</span>`;
          borderStyle = 'border-red-800 bg-red-950/10 hover:border-red-500'; expiryTextColor = 'text-red-400 font-bold';
        } else { badge = `<span class="text-[10px] bg-green-950 text-green-400 border border-green-800 px-2 py-0.5 rounded-full font-bold">Active</span>`; }

        const card = document.createElement('div');
        card.className = `p-4 border ${borderStyle} rounded-2xl bg-black/40 flex flex-col gap-2 cursor-pointer transition-all`;
        card.setAttribute('onclick', `startEditMember(${member.rowNumber})`);
        card.innerHTML = `<div class="flex justify-between items-start"><div><h4 class="text-white font-bold text-sm">${member.fullName}</h4><p class="text-gray-500 text-[11px]">${member.package} • ${member.phone}</p><div class="mt-2 flex items-center ${expiryTextColor} text-[11px]"><i class="fa-solid fa-calendar-days mr-1.5 opacity-80"></i><span>หมดอายุ: <span class="font-mono">${member.expiryDate}</span></span></div></div>${badge}</div><div class="flex justify-between items-center mt-1 border-t border-gray-950 pt-2 text-[11px]"><span class="text-gray-500"><i class="fa-solid fa-fingerprint mr-1"></i>รหัส: <span class="font-mono text-gray-500">${member.fingerprintId || 'ยังไม่ลงทะเบียน'}</span> <button onclick="event.stopPropagation(); openEnrollFingerprintModal(${member.rowNumber}, '${member.fullName.replace(/'/g, "\\'")}')" class="text-red-500 hover:text-red-400 cursor-pointer ml-1" title="ลงทะเบียน/เปลี่ยนลายนิ้วมือ"><i class="fa-solid fa-rotate"></i></button></span><span class="flex items-center gap-2"><span class="text-red-400 font-black"><i class="fa-solid fa-dumbbell mr-1"></i>${member.checkInCount} ครั้ง</span><button onclick="event.stopPropagation(); manualCheckInUI(${member.rowNumber}, '${member.fullName.replace(/'/g, "\\'")}')" class="bg-green-950 hover:bg-green-900 text-green-400 border border-green-800 px-2 py-1 rounded-lg text-[10px] font-bold cursor-pointer" title="เช็คอินด้วยมือ (ใช้เวลาเครื่องสแกนใช้งานไม่ได้)"><i class="fa-solid fa-check mr-1"></i>เช็คอิน</button></span></div><button onclick="event.stopPropagation(); openMemberHistory(${member.rowNumber})" class="mt-1 text-[10px] text-gray-500 hover:text-red-400 border-t border-gray-950 pt-2 text-left cursor-pointer"><i class="fa-solid fa-clock-rotate-left mr-1"></i>ดูประวัติทั้งหมด</button>`;
        container.appendChild(card);
      });

      const pager = document.createElement('div');
      pager.className = "flex justify-between items-center pt-4 mt-3 border-t border-gray-900 sticky bottom-0 bg-[#0b0b0b]/95 backdrop-blur-sm pb-1";
      const dots = totalPages <= 10
        ? Array.from({ length: totalPages }, (_, idx) => idx + 1).map(p =>
            `<span class="w-1.5 h-1.5 rounded-full ${p === currentPage ? 'bg-red-500' : 'bg-gray-800'} transition-all"></span>`
          ).join('')
        : '';
      pager.innerHTML = `
        <button onclick="changePage(-1)" ${currentPage <= 1 ? 'disabled' : ''} class="w-9 h-9 rounded-full border border-gray-800 hover:border-red-600 hover:bg-red-950/40 disabled:opacity-20 disabled:hover:border-gray-800 disabled:hover:bg-transparent disabled:cursor-not-allowed cursor-pointer flex items-center justify-center text-gray-400 hover:text-red-400 transition-all shrink-0">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <div class="flex flex-col items-center gap-1.5">
          <span class="text-[11px] text-gray-400 font-bold tracking-wide">หน้า <span class="text-white">${currentPage}</span> / ${totalPages} <span class="text-gray-700 mx-0.5">•</span> ${array.length} รายการ</span>
          <div class="flex items-center gap-1">${dots}</div>
        </div>
        <button onclick="changePage(1)" ${currentPage >= totalPages ? 'disabled' : ''} class="w-9 h-9 rounded-full border border-gray-800 hover:border-red-600 hover:bg-red-950/40 disabled:opacity-20 disabled:hover:border-gray-800 disabled:hover:bg-transparent disabled:cursor-not-allowed cursor-pointer flex items-center justify-center text-gray-400 hover:text-red-400 transition-all shrink-0">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      `;
      container.appendChild(pager);
    }

    function handleTrainerPhotoSelect(e) {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith('image/')) return;
      const statusEl = document.getElementById('trainerPhotoUploadStatus');
      statusEl.innerText = 'กำลังอัปโหลด...';

      const reader = new FileReader();
      reader.onload = function(evt) {
        const base64Data = evt.target.result;
        // แสดง preview ทันทีระหว่างรออัปโหลด
        const preview = document.getElementById('trainerPhotoPreview');
        preview.src = base64Data;
        preview.classList.remove('hidden');
        document.getElementById('trainerPhotoPlaceholder').classList.add('hidden');

        google.script.run
          .withSuccessHandler(res => {
            if (res.success) {
              document.getElementById('trainerPhotoUrl').value = res.url;
              statusEl.innerText = '✅ อัปโหลดสำเร็จ';
            } else {
              statusEl.innerText = '❌ อัปโหลดไม่สำเร็จ: ' + res.message;
            }
          })
          .withFailureHandler(err => { goToLoginIfExpired(err); statusEl.innerText = '❌ เกิดข้อผิดพลาด'; })
          .uploadTrainerPhoto(base64Data, file.type, file.name, SESSION_TOKEN);
      };
      reader.readAsDataURL(file);
    }

    function startEditTrainer(rowNumber) {
      const t = localTrainersArray.find(x => x.rowNumber === rowNumber);
      if (!t) return;
      document.getElementById('trainerRowNumber').value = t.rowNumber;
      document.getElementById('trainerFullName').value = t.fullName;
      document.getElementById('trainerSpecialty').value = t.specialty || '';
      document.getElementById('trainerPhone').value = t.phone || '';
      document.getElementById('trainerEmail').value = t.email || '';
      document.getElementById('trainerBio').value = t.bio || '';
      document.getElementById('trainerPhotoUrl').value = t.photoUrl || '';
      document.getElementById('trainerStartHour').value = t.startHour;
      document.getElementById('trainerEndHour').value = t.endHour;
      document.getElementById('trainerSlotMinutes').value = t.slotMinutes;
      document.getElementById('trainerStatus').value = t.status;
      document.querySelectorAll('.trainerDayChk').forEach(c => { c.checked = (t.workingDays || []).indexOf(c.value) !== -1; });

      const preview = document.getElementById('trainerPhotoPreview');
      const placeholder = document.getElementById('trainerPhotoPlaceholder');
      if (t.photoUrl) { preview.src = t.photoUrl; preview.classList.remove('hidden'); placeholder.classList.add('hidden'); }
      else { preview.classList.add('hidden'); placeholder.classList.remove('hidden'); }
      document.getElementById('trainerPhotoUploadStatus').innerText = '';

      document.getElementById('trainerEditIndicator').classList.remove('hidden');
      document.getElementById('trainerFormTitle').innerText = 'EDIT TRAINER';
      document.getElementById('btnTrainerSubmit').innerText = 'Update Trainer';
      document.getElementById('btnTrainerSubmit').className = 'w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3.5 rounded-xl text-xs uppercase cursor-pointer';
      document.getElementById('btnDeleteTrainer').classList.remove('hidden');
    }

                (b.status === 'Booked'
                  ? '<button onclick="setBookingStatus(\'' + b.bookingId + '\',\'Completed\')" class="text-green-500 hover:text-green-400 cursor-pointer mr-2" title="Mark Completed"><i class="fa-solid fa-check"></i></button>' +
                    '<button onclick="setBookingStatus(\'' + b.bookingId + '\',\'Cancelled\')" class="text-red-500 hover:text-red-400 cursor-pointer" title="Cancel"><i class="fa-solid fa-xmark"></i></button>'
                  : '') +
              '</td>';
            tbody.appendChild(tr);
          });
        })
        .withFailureHandler(goToLoginIfExpired)
        .getTrainerScheduleByDate(SESSION_TOKEN, trainerId, dateStr);
    }

    // ==========================================
    // 📅 แอดมินจองคิวเทรนเนอร์แทนสมาชิก (หน้าเคาน์เตอร์ / โทรมาจอง)
    // ==========================================
    let adminSelectedSlot = '';

    function populateAdminBookMemberSelect() {
      const select = document.getElementById('adminBookMemberSelect');
      if (!select) return;
      const currentVal = select.value;
      select.innerHTML = '<option value="">-- เลือกสมาชิก --</option>';
      (localMembersArray || []).forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.rowNumber;
        opt.innerText = m.fullName + (m.phone ? ' (' + m.phone + ')' : '');
        select.appendChild(opt);
      });
      if (currentVal) select.value = currentVal;
    }

    function loadAdminBookSlots() {
      const trainerId = document.getElementById('scheduleTrainerSelect').value;
      const dateStr = document.getElementById('scheduleDate').value;
      const container = document.getElementById('adminBookSlotsContainer');
      const msg = document.getElementById('adminBookSlotsMsg');
      container.innerHTML = '';
      document.getElementById('btnAdminConfirmBooking').classList.add('hidden');
      adminSelectedSlot = '';

      if (!trainerId || !dateStr) {
        msg.innerText = 'เลือกเทรนเนอร์ วันที่ และสมาชิกด้านบนก่อน';
        return;
      }
      msg.innerText = 'กำลังโหลดช่วงเวลาว่าง...';

      google.script.run
        .withSuccessHandler(res => {
          msg.innerText = '';
          if (!res.success) { msg.innerText = res.message || 'เกิดข้อผิดพลาด'; return; }
          if (!res.slots || res.slots.length === 0) {
            msg.innerText = res.message || 'ไม่มีช่วงเวลาว่างในวันที่เลือก';
            return;
          }
          res.slots.forEach(slot => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'bg-black border border-gray-800 hover:border-red-500 text-gray-300 text-[11px] py-2 rounded-lg cursor-pointer';
            btn.innerText = slot;
            btn.onclick = () => selectAdminBookSlot(slot, btn);
            container.appendChild(btn);
          });
        })
        .withFailureHandler(goToLoginIfExpired)
        .getTrainerAvailableSlotsAdmin(SESSION_TOKEN, trainerId, dateStr);
    }

    function selectAdminBookSlot(slot, btnEl) {
      adminSelectedSlot = slot;
      document.querySelectorAll('#adminBookSlotsContainer button').forEach(b => {
        b.className = 'bg-black border border-gray-800 hover:border-red-500 text-gray-300 text-[11px] py-2 rounded-lg cursor-pointer';
      });
      btnEl.className = 'bg-red-600 border border-red-500 text-white text-[11px] py-2 rounded-lg cursor-pointer font-bold';
      document.getElementById('adminSelectedSlotText').innerText = slot;
      document.getElementById('btnAdminConfirmBooking').classList.remove('hidden');
    }

    function confirmAdminBooking() {
      const memberRow = document.getElementById('adminBookMemberSelect').value;
      const trainerId = document.getElementById('scheduleTrainerSelect').value;
      const dateStr = document.getElementById('scheduleDate').value;
      if (!memberRow) { alert('กรุณาเลือกสมาชิก'); return; }
      if (!trainerId || !dateStr || !adminSelectedSlot) return;

      const btn = document.getElementById('btnAdminConfirmBooking');
      btn.disabled = true;

      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          btn.disabled = false;
          if (res.success) {
            loadAdminBookSlots();
            loadTrainerScheduleAdmin();
            loadAllBookings();
          }
        })
        .withFailureHandler(err => { goToLoginIfExpired(err); btn.disabled = false; })
        .adminBookTrainerSlot(SESSION_TOKEN, memberRow, trainerId, dateStr, adminSelectedSlot);
    }

    function setBookingStatus(bookingId, status) {
      google.script.run
        .withSuccessHandler(res => { alert(res.message); loadTrainerScheduleAdmin(); loadAllBookings(); })
        .withFailureHandler(goToLoginIfExpired)
        .updateBookingStatus(bookingId, status, SESSION_TOKEN);
    }

    function loadAllBookings() {
      const tbody = document.getElementById('allBookingsTableBody');
      google.script.run
        .withSuccessHandler(list => {
          if (!list || list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-gray-600">ยังไม่มีข้อมูล...</td></tr>';
            return;
          }
          tbody.innerHTML = '';
          list.forEach(b => {
            let badge = '<span class="text-[10px] bg-green-950 text-green-400 border border-green-800 px-2 py-0.5 rounded-full font-bold">Booked</span>';
            if (b.status === 'Cancelled') badge = '<span class="text-[10px] bg-gray-800 text-gray-400 border border-gray-700 px-2 py-0.5 rounded-full font-bold">Cancelled</span>';
            if (b.status === 'Completed') badge = '<span class="text-[10px] bg-blue-950 text-blue-400 border border-blue-800 px-2 py-0.5 rounded-full font-bold">Completed</span>';

            const tr = document.createElement('tr');
            tr.className = 'hover:bg-white/[0.02]';
            tr.innerHTML =
              '<td class="py-3 pl-2 font-mono text-gray-500">' + b.timestamp + '</td>' +
              '<td class="py-3 text-red-400 font-medium">' + b.trainerName + '</td>' +
              '<td class="py-3 text-white">' + b.memberName + '</td>' +
              '<td class="py-3 font-mono text-gray-400">' + b.date + ' • ' + b.timeSlot + '</td>' +
              '<td class="py-3 pr-2">' + badge + '</td>';
            tbody.appendChild(tr);
          });
        })
        .withFailureHandler(goToLoginIfExpired)
        .getAllBookings(SESSION_TOKEN);
    }

    function handleAdminSubmit(e) {
      e.preventDefault();
      const adminData = {
        user: document.getElementById('adminUser').value.trim(),
        pass: document.getElementById('adminPassword').value,
        email: document.getElementById('adminEmail').value.trim(),
        role: document.getElementById('adminRole').value
      };
      google.script.run
        .withSuccessHandler(res => { alert(res.message); document.getElementById('adminForm').reset(); loadAdminList(); })
        .withFailureHandler(goToLoginIfExpired)
        .addAdminData(adminData, SESSION_TOKEN);
    }

    function loadAdminList() {
      const tbody = document.getElementById('adminListTableBody'); tbody.innerHTML = '';
      google.script.run
        .withSuccessHandler(list => {
          list.forEach(admin => {
            const tr = document.createElement('tr'); tr.className = "hover:bg-white/[0.02]";
            tr.innerHTML = `<td class="py-3 pl-2 text-white">${admin.user}</td><td class="py-3 text-gray-400">${admin.role}</td><td class="py-3 text-gray-500">${admin.email || '-'}</td><td class="py-3 text-right pr-2"><button onclick="deleteAdmin('${admin.user}')" class="text-gray-600 hover:text-red-400 cursor-pointer"><i class="fa-solid fa-trash-can"></i></button></td>`;
            tbody.appendChild(tr);
          });
        })
        .withFailureHandler(goToLoginIfExpired)
        .getAdminList(SESSION_TOKEN);
    }

    function deleteAdmin(username) {
      if(username === 'admin_im') return;
      if(confirm(`ลบแอดมิน "${username}"?`)) {
        google.script.run
          .withSuccessHandler(res => { alert(res.message); loadAdminList(); })
          .withFailureHandler(goToLoginIfExpired)
          .deleteAdminData(username, SESSION_TOKEN);
      }
    }

    function loadStats() {
      google.script.run
        .withSuccessHandler(data => {
          document.getElementById('stat-total').innerText = data.total;
          document.getElementById('stat-active').innerText = data.active;
          const tbody = document.getElementById('liveFeedTableBody');
          if (!data.logs || data.logs.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-gray-600">ยังไม่มีประวัติสแกนลายนิ้วมือ...</td></tr>'; return; }
          tbody.innerHTML = '';
          data.logs.forEach(log => {
            let sBadge = '', rClass = '';
            if (log.status === 'SUCCESS') sBadge = '<span class="bg-green-950 text-green-400 border border-green-900 px-2 py-0.5 rounded text-[10px]">SUCCESS</span>';
            else if (log.status === 'BLOCKED') { sBadge = '<span class="bg-red-950 text-red-400 border border-red-800 px-2 py-0.5 rounded text-[10px]">BLOCKED</span>'; rClass = 'bg-red-950/5'; }
            else sBadge = '<span class="bg-gray-800 text-gray-400 border border-gray-700 px-2 py-0.5 rounded text-[10px]">UNKNOWN</span>';

            const tr = document.createElement('tr'); tr.className = `hover:bg-white/[0.02] ${rClass}`;
            tr.innerHTML = `<td class="py-3 font-mono text-gray-400">${log.time}</td><td class="py-3 font-bold text-white">${log.name}</td><td class="py-3 font-mono text-gray-500">${log.uid}</td><td class="py-3">${sBadge}</td><td class="py-3 pr-2 text-gray-400">${log.details}</td>`;
            tbody.appendChild(tr);
          });
        })
        .withFailureHandler(goToLoginIfExpired)
        .getDashboardStats(SESSION_TOKEN);
    }

    function loadMonthlyStats() {
      google.script.run
        .withSuccessHandler(data => renderMonthlyChart(data))
        .withFailureHandler(goToLoginIfExpired)
        .getMonthlyStats(SESSION_TOKEN);
    }

    function renderMonthlyChart(data) {
      if (!data || data.length === 0) return;
      const labels = data.map(d => d.label);
      const newMembers = data.map(d => d.newMembers);
      const revenue = data.map(d => d.revenue);

      const ctx = document.getElementById('monthlyChart').getContext('2d');
      if (monthlyChartInstance) monthlyChartInstance.destroy();

      monthlyChartInstance = new Chart(ctx, {
        data: {
          labels: labels,
          datasets: [
            {
              type: 'bar',
              label: 'สมาชิกใหม่ (คน)',
              data: newMembers,
              backgroundColor: 'rgba(220, 38, 38, 0.6)',
              borderRadius: 6,
              yAxisID: 'y'
            },
            {
              type: 'line',
              label: 'รายได้ (บาท)',
              data: revenue,
              borderColor: '#22c55e',
              backgroundColor: '#22c55e',
              tension: 0.3,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { labels: { color: '#9CA3AF', font: { family: 'Prompt' } } }
          },
          scales: {
            x: { ticks: { color: '#6B7280' }, grid: { color: '#1a1a1a' } },
            y: {
              position: 'left', ticks: { color: '#6B7280' }, grid: { color: '#1a1a1a' },
              title: { display: true, text: 'คน', color: '#6B7280' }
            },
            y1: {
              position: 'right', ticks: { color: '#6B7280' }, grid: { display: false },
              title: { display: true, text: 'บาท', color: '#6B7280' }
            }
          }
        }
      });
    }

    function loadExpiringMembers() {
      const container = document.getElementById('expiringMembersList');
      const badge = document.getElementById('expiringCountBadge');
      google.script.run
        .withSuccessHandler(list => {
          badge.innerText = (list ? list.length : 0) + ' คน';
          if (!list || list.length === 0) {
            container.innerHTML = '<p class="text-gray-600 text-xs text-center py-6">ไม่มีสมาชิกที่ใกล้หมดอายุตอนนี้ 🎉</p>';
            return;
          }
          container.innerHTML = '';
          list.forEach(m => {
            const isExpired = m.daysLeft < 0;
            const badgeText = isExpired ? 'หมดอายุแล้ว ' + Math.abs(m.daysLeft) + ' วัน' : (m.daysLeft === 0 ? 'หมดอายุวันนี้' : 'เหลือ ' + m.daysLeft + ' วัน');
            const badgeClass = isExpired
              ? 'bg-red-950 text-red-400 border-red-800'
              : 'bg-yellow-950 text-yellow-400 border-yellow-800';
            const row = document.createElement('div');
            row.className = 'flex items-center justify-between p-3 rounded-xl bg-black/40 border border-gray-900';
            row.innerHTML = `
              <div class="min-w-0">
                <p class="text-white font-bold text-xs truncate">${m.fullName}</p>
                <p class="text-gray-500 text-[10px]">${m.package} • ${m.phone || '-'} • หมดอายุ ${m.expiryDate}</p>
              </div>
              <span class="text-[10px] px-2.5 py-1 rounded-full border font-bold uppercase tracking-wider shrink-0 ml-2 ${badgeClass}">${badgeText}</span>
            `;
            container.appendChild(row);
          });
        })
        .withFailureHandler(goToLoginIfExpired)
        .getExpiringMembers(SESSION_TOKEN);
    }

    function loadLowStockProducts() {
      const container = document.getElementById('lowStockProductsList');
      const badge = document.getElementById('lowStockCountBadge');
      google.script.run
        .withSuccessHandler(list => {
          badge.innerText = (list ? list.length : 0) + ' รายการ';
          if (!list || list.length === 0) {
            container.innerHTML = '<p class="text-gray-600 text-xs text-center py-6">สินค้าทุกชิ้นยังมีเพียงพอ 🎉</p>';
            return;
          }
          container.innerHTML = '';
          list.forEach(p => {
            const outOfStock = p.stock <= 0;
            const badgeText = outOfStock ? 'สินค้าหมด' : 'เหลือ ' + p.stock + ' ชิ้น';
            const badgeClass = outOfStock
              ? 'bg-red-950 text-red-400 border-red-800'
              : 'bg-yellow-950 text-yellow-400 border-yellow-800';
            const row = document.createElement('div');
            row.className = 'flex items-center justify-between p-3 rounded-xl bg-black/40 border border-gray-900';
            row.innerHTML = `
              <div class="min-w-0">
                <p class="text-white font-bold text-xs truncate">${p.name}</p>
                <p class="text-gray-500 text-[10px]">แจ้งเตือนที่ ${p.threshold} ชิ้น</p>
              </div>
              <span class="text-[10px] px-2.5 py-1 rounded-full border font-bold uppercase tracking-wider shrink-0 ml-2 ${badgeClass}">${badgeText}</span>
            `;
            container.appendChild(row);
          });
        })
        .withFailureHandler(goToLoginIfExpired)
        .getLowStockProducts(SESSION_TOKEN);
    }

    function loadBirthdayMembers() {
      const container = document.getElementById('birthdayMembersList');
      const badge = document.getElementById('birthdayCountBadge');
      google.script.run
        .withSuccessHandler(list => {
          badge.innerText = (list ? list.length : 0) + ' คน';
          if (!list || list.length === 0) {
            container.innerHTML = '<p class="text-gray-600 text-xs text-center py-6">ไม่มีสมาชิกเกิดเดือนนี้</p>';
            return;
          }
          container.innerHTML = '';
          list.forEach(m => {
            const row = document.createElement('div');
            row.className = 'flex items-center justify-between p-3 rounded-xl bg-black/40 border border-gray-900';
            row.innerHTML = `
              <div class="min-w-0">
                <p class="text-white font-bold text-xs truncate">🎂 ${m.fullName}</p>
                <p class="text-gray-500 text-[10px]">${m.package} • ${m.phone || '-'} • เกิดวันที่ ${m.birthDay}</p>
              </div>
              <span class="text-[10px] px-2.5 py-1 rounded-full border font-bold uppercase tracking-wider shrink-0 ml-2 bg-pink-950 text-pink-400 border-pink-800">ลด ${birthdayDiscountSettings.type === 'Fixed' ? birthdayDiscountSettings.value.toLocaleString('th-TH') + ' บาท' : birthdayDiscountSettings.value + '%'}</span>
            `;
            container.appendChild(row);
          });
        })
        .withFailureHandler(goToLoginIfExpired)
        .getBirthdayMembersThisMonth(SESSION_TOKEN);
    }

    function loadLeaderboard() {
      const container = document.getElementById('leaderboardList');
      google.script.run
        .withSuccessHandler(list => {
          if (!list || list.length === 0) {
            container.innerHTML = '<p class="text-gray-600 text-xs text-center py-6">ยังไม่มีข้อมูลการเช็คอิน</p>';
            return;
          }
          const medals = ['🥇', '🥈', '🥉'];
          container.innerHTML = '';
          list.forEach((m, idx) => {
            const row = document.createElement('div');
            row.className = "flex items-center justify-between p-3 rounded-xl bg-black/40 border border-gray-900";
            const rankDisplay = medals[idx] || `#${idx + 1}`;
            row.innerHTML = `
              <div class="flex items-center gap-3">
                <span class="text-lg w-8 text-center">${rankDisplay}</span>
                <div>
                  <p class="text-white font-bold text-xs">${m.fullName}</p>
                  <p class="text-gray-500 text-[10px]">${m.package}</p>
                </div>
              </div>
              <span class="text-red-400 font-black text-sm"><i class="fa-solid fa-dumbbell mr-1.5"></i>${m.checkInCount} ครั้ง</span>
            `;
            container.appendChild(row);
          });
        })
        .withFailureHandler(goToLoginIfExpired)
        .getCheckInLeaderboard(SESSION_TOKEN);
    }

    function loadAuditLog() {
      const tbody = document.getElementById('auditLogTableBody');
      google.script.run
        .withSuccessHandler(logs => {
          if (!logs || logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-gray-600">ยังไม่มีบันทึก...</td></tr>';
            return;
          }
          tbody.innerHTML = '';
          logs.forEach(log => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-white/[0.02]";
            tr.innerHTML = `
              <td class="py-3 pl-2 font-mono text-gray-500">${log.timestamp}</td>
              <td class="py-3 font-bold text-white">${log.admin}</td>
              <td class="py-3 text-red-400 font-medium">${log.action}</td>
              <td class="py-3 text-gray-300">${log.target}</td>
              <td class="py-3 pr-2 text-gray-500">${log.details}</td>
            `;
            tbody.appendChild(tr);
          });
        })
        .withFailureHandler(goToLoginIfExpired)
        .getAuditLog(SESSION_TOKEN);
    }

    function initForm() { document.getElementById('startDate').valueAsDate = new Date(); calculateExpiryDate(); setNewMemberPaymentMethod('cash'); }

    function logout() {
      if(confirm("Confirm Logout?")) {
        google.script.run.logoutAdmin(SESSION_TOKEN);
        window.top.location.href = "<?= getScriptUrl() ?>?page=login";
      }
    }

    window.onload = () => {
      initForm(); loadStats(); loadMemberList(); loadMonthlyStats(); loadLeaderboard(); loadExpiringMembers(); loadLowStockProducts(); loadBirthdayMembers(); loadPackageList(); loadBirthdayDiscountSettings(); loadPaymentQRInfo();
      addCustomerRow();
      const expenseDateEl = document.getElementById('expenseDate');
      if (expenseDateEl) expenseDateEl.value = formatYMD_(new Date());
      setPosPaymentMethod('cash');
      setRenewalPaymentMethod('cash');
      setInterval(() => { if(document.getElementById('dashboard').classList.contains('active')) { loadStats(); loadExpiringMembers(); loadLowStockProducts(); loadBirthdayMembers(); } }, 10000);
    };
  </script>
