<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDUSTRIAL Muscle - Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700;900&family=Prompt:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background-color: #050505;
      color: #F3F4F6;
      font-family: 'Prompt', sans-serif;
      background-image:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 14px),
        radial-gradient(ellipse at top, rgba(220, 38, 38, 0.10), transparent 55%);
      background-size: 14px 100%, 100% 100%;
    }
    .industrial-card {
      background: rgba(15,15,15,0.9);
      backdrop-filter: blur(10px);
      border: 1px solid #222;
      box-shadow: 0 0 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(220, 38, 38, 0.05);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="industrial-card rounded-3xl p-10 max-w-md w-full relative overflow-hidden">
    <div class="absolute top-0 left-0 w-1.5 h-full bg-red-600"></div>

    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-white tracking-tighter mb-1 font-['Urbanist']">INDUSTRIAL</h1>
      <h1 class="text-lg font-bold text-red-600 tracking-[0.3em] uppercase mb-4 font-['Urbanist']">Muscle</h1>
      <div class="h-px bg-gradient-to-r from-transparent via-gray-800 to-transparent w-full my-4"></div>
      <h2 class="text-xl font-black text-white font-['Urbanist']">ตั้งรหัสผ่านใหม่</h2>
    </div>

    <div id="checkingMsg" class="text-gray-500 text-sm text-center py-6">
      <i class="fa-solid fa-circle-notch fa-spin mr-2"></i>กำลังตรวจสอบลิงก์...
    </div>

    <div id="invalidTokenMsg" class="hidden text-red-400 text-sm bg-red-500/10 p-4 rounded-xl border border-red-500/20 text-center">
      <i class="fa-solid fa-triangle-exclamation mr-1"></i> ลิงก์นี้หมดอายุหรือไม่ถูกต้อง กรุณาขอลิงก์รีเซ็ตใหม่จากหน้า Login
    </div>

    <div id="resetForm" class="hidden space-y-5">
      <div>
        <label class="block text-[10px] uppercase tracking-[0.2em] text-gray-500 mb-2 font-bold ml-1">รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label>
        <div class="flex items-center bg-black/50 border border-gray-800 rounded-xl px-4 py-3 focus-within:border-red-500 transition-all">
          <i class="fa-solid fa-key text-gray-600 mr-3 text-sm"></i>
          <input type="password" id="newPassword" class="bg-transparent w-full text-white placeholder-gray-700 outline-none">
        </div>
      </div>
      <div>
        <label class="block text-[10px] uppercase tracking-[0.2em] text-gray-500 mb-2 font-bold ml-1">ยืนยันรหัสผ่านใหม่</label>
        <div class="flex items-center bg-black/50 border border-gray-800 rounded-xl px-4 py-3 focus-within:border-red-500 transition-all">
          <i class="fa-solid fa-key text-gray-600 mr-3 text-sm"></i>
          <input type="password" id="confirmPassword" class="bg-transparent w-full text-white placeholder-gray-700 outline-none">
        </div>
      </div>
      <button onclick="submitReset()" id="btnReset" class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white font-black py-4 rounded-xl text-sm tracking-[0.2em] uppercase cursor-pointer transition-all">
        บันทึกรหัสผ่านใหม่
      </button>
    </div>
  </div>

  <script>
    const RESET_TOKEN = "<?= resetToken ?>";

    window.onload = () => {
      if (!RESET_TOKEN) {
        document.getElementById('checkingMsg').classList.add('hidden');
        document.getElementById('invalidTokenMsg').classList.remove('hidden');
        return;
      }
      google.script.run
        .withSuccessHandler(res => {
          document.getElementById('checkingMsg').classList.add('hidden');
          if (res.valid) document.getElementById('resetForm').classList.remove('hidden');
          else document.getElementById('invalidTokenMsg').classList.remove('hidden');
        })
        .withFailureHandler(() => {
          document.getElementById('checkingMsg').classList.add('hidden');
          document.getElementById('invalidTokenMsg').classList.remove('hidden');
        })
        .checkResetTokenValid(RESET_TOKEN);
    };

    function submitReset() {
      const pass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      if (pass.length < 6) { alert('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'); return; }
      if (pass !== confirmPass) { alert('รหัสผ่านทั้งสองช่องไม่ตรงกัน'); return; }

      const btn = document.getElementById('btnReset');
      btn.disabled = true; btn.innerText = 'กำลังบันทึก...';

      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          if (res.success) window.top.location.href = "<?= getScriptUrl() ?>?page=login";
          else { btn.disabled = false; btn.innerText = 'บันทึกรหัสผ่านใหม่'; }
        })
        .withFailureHandler(err => {
          alert(err.message || 'เกิดข้อผิดพลาด');
          btn.disabled = false; btn.innerText = 'บันทึกรหัสผ่านใหม่';
        })
        .resetAdminPassword(RESET_TOKEN, pass);
    }
  </script>
</body>
</html>
