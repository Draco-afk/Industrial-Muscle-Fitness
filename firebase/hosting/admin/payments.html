<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrial Muscle - Admin - Payments</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700;900&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../shared/admin-nav.css">
  <style>
    .badge-Refunded { background: rgba(107,114,128,0.15); color: #9ca3af; }
    .badge-normal { background: rgba(34,197,94,0.15); color: #4ade80; }
  </style>
</head>
<body class="min-h-screen">
  <div id="loadingGate" class="fixed inset-0 bg-black flex items-center justify-center z-50">
    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-red-500"></i>
  </div>
  <div id="navSlot"></div>

  <div id="app" class="hidden md:ml-64 p-4 md:p-8 pt-24 md:pt-8 max-w-6xl">

    <div class="panel rounded-2xl p-5 mb-6">
      <h3 class="text-xs uppercase tracking-widest text-gray-500 mb-3">ต่ออายุสมาชิก</h3>
      <div class="grid md:grid-cols-3 gap-3 mb-3">
        <select id="pickMember" class="bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500"><option value="">เลือกสมาชิก...</option></select>
        <select id="pickPackage" class="bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500"><option value="">เลือกแพ็กเกจ...</option></select>
        <select id="payMethod" class="bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
          <option value="cash">เงินสด</option>
          <option value="transfer">โอนเงิน</option>
        </select>
      </div>
      <div class="grid md:grid-cols-2 gap-3 mb-3">
        <div>
          <!-- Drop the transfer slip here and the QR is read out of the image,
               so the same slip can't be reused for a second renewal. -->
          <div id="slipDrop" class="border-2 border-dashed border-gray-700 hover:border-red-500 rounded-xl p-4 text-center cursor-pointer transition-colors">
            <i id="slipIcon" class="fa-solid fa-qrcode text-2xl text-gray-600"></i>
            <p id="slipStatus" class="text-xs text-gray-500 mt-1.5">ลากรูปสลิปโอนเงินมาวาง หรือคลิกเพื่อเลือกไฟล์</p>
            <input id="slipFile" type="file" accept="image/*" class="hidden">
          </div>
          <input id="qrData" placeholder="รหัสสลิป QR (บังคับ — ป้องกันใช้สลิปซ้ำ)" class="w-full mt-2 bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500 font-mono">
        </div>
        <input id="couponCode" placeholder="โค้ดคูปอง (ถ้ามี)" class="bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500 self-start">
      </div>
      <button onclick="submitRenewal()" id="renewBtn" class="w-full md:w-auto btn-primary px-6 py-2.5 rounded-xl text-sm font-bold">ต่ออายุ + ออกใบเสร็จ</button>
      <p id="renewErr" class="hidden text-red-400 text-xs bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2 mt-2"></p>
    </div>

    <div class="panel rounded-2xl overflow-hidden overflow-x-auto">
      <table class="w-full">
        <thead><tr><th>วันเวลา</th><th>สมาชิก</th><th>แพ็กเกจ</th><th>เลขที่ใบเสร็จ</th><th>ยอด</th><th>สถานะ</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="emptyState" class="hidden text-center text-gray-600 text-sm py-10">ยังไม่มีประวัติการชำระเงิน</p>
    </div>
  </div>

  <script type="module">
    import { callServer, auth, onAuthStateChanged, signOut } from '../shared/firebase-init.js';
    import { renderNav } from '../shared/admin-nav.js';
    import { openReceiptWindow, offerReceiptPrint } from '../shared/receipt.js';
    import { initSlipScanner } from '../shared/slip-scanner.js';

    let resetSlipDrop = () => {};

    function escapeHtml(s) {
      return (s || '').toString().replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = '../login.html'; return; }
      const tok = await user.getIdTokenResult();
      if (tok.claims.role !== 'admin') { window.location.href = '../login.html'; return; }
      document.getElementById('navSlot').outerHTML = renderNav('payments', tok.claims.adminRole);
      document.getElementById('loadingGate').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      window.doLogout = async () => { await signOut(auth); window.location.href = '../login.html'; };
      resetSlipDrop = initSlipScanner({
        dropId: 'slipDrop', fileId: 'slipFile', targetId: 'qrData', statusId: 'slipStatus', iconId: 'slipIcon'
      }) || resetSlipDrop;
      await Promise.all([loadMembers(), loadPackages(), loadLogs()]);
    });

    async function loadMembers() {
      const members = await callServer('getMemberList');
      document.getElementById('pickMember').innerHTML = '<option value="">เลือกสมาชิก...</option>' +
        members.map((m) => `<option value="${m.docId}">${escapeHtml(m.fullName)} (${escapeHtml(m.phone)})</option>`).join('');
    }

    async function loadPackages() {
      const pkgs = await callServer('getPackageList');
      document.getElementById('pickPackage').innerHTML = '<option value="">เลือกแพ็กเกจ...</option>' +
        pkgs.map((p) => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)} (${p.price}฿ / ${p.durationMonths} เดือน)</option>`).join('');
    }

    window.submitRenewal = async function submitRenewal() {
      const payload = {
        memberDocId: document.getElementById('pickMember').value,
        package: document.getElementById('pickPackage').value,
        paymentMethod: document.getElementById('payMethod').value,
        qrData: document.getElementById('qrData').value.trim(),
        couponCode: document.getElementById('couponCode').value.trim()
      };
      if (!payload.memberDocId || !payload.package) return showErr('กรุณาเลือกสมาชิกและแพ็กเกจ');

      const btn = document.getElementById('renewBtn');
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
      try {
        const res = await callServer('processRenewalPayment', payload);
        if (res.success) {
          alert(res.message);
          document.getElementById('qrData').value = '';
          document.getElementById('couponCode').value = '';
          document.getElementById('renewErr').classList.add('hidden');
          resetSlipDrop();
          await loadLogs();
          await offerReceiptPrint(callServer, 'generateReceiptPDF', res.receiptNo);
        } else {
          showErr(res.message);
        }
      } catch (e) {
        showErr(e.message || 'เกิดข้อผิดพลาด');
      } finally {
        btn.disabled = false; btn.innerHTML = 'ต่ออายุ + ออกใบเสร็จ';
      }
    };

    function showErr(msg) {
      const el = document.getElementById('renewErr');
      el.textContent = msg; el.classList.remove('hidden');
    }

    async function loadLogs() {
      const logs = await callServer('getPaymentLogs');
      const tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      document.getElementById('emptyState').classList.toggle('hidden', logs.length > 0);
      for (const p of logs) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="text-gray-400">${escapeHtml(p.timestamp)}</td>
          <td class="font-medium">${escapeHtml(p.memberName)}</td>
          <td class="text-gray-400">${escapeHtml(p.package)}</td>
          <td class="text-gray-400 font-mono">${escapeHtml(p.receiptNo)}</td>
          <td class="text-gray-400">${(p.amount || 0).toLocaleString('th-TH')} บาท</td>
          <td><span class="badge badge-${p.refundStatus === 'Refunded' ? 'Refunded' : 'normal'}">${p.refundStatus === 'Refunded' ? 'คืนเงินแล้ว' : 'ปกติ'}</span>
              <span class="text-[10px] ml-1 ${p.paymentMethod === 'โอนเงิน' ? 'text-blue-400' : 'text-green-400'}">${escapeHtml(p.paymentMethod || '')}</span></td>
          <td class="text-right whitespace-nowrap">
            <button data-act="print" class="text-gray-400 hover:text-white px-1.5" title="พิมพ์ใบเสร็จ"><i class="fa-solid fa-print"></i></button>
            ${p.refundStatus !== 'Refunded' && !p.bundledInDailyBill ? `
              <button data-act="method" class="text-blue-400 hover:text-blue-300 px-1.5" title="แก้วิธีชำระเงิน"><i class="fa-solid fa-right-left"></i></button>
              <button data-act="void" class="text-red-400 hover:text-red-300 px-1.5" title="ยกเลิก/คืนเงิน"><i class="fa-solid fa-rotate-left"></i></button>` : ''}
          </td>`;

        tr.querySelector('[data-act="print"]').onclick = async () => {
          const res = await callServer('generateReceiptPDF', { receiptNo: p.receiptNo });
          if (!res.success) return alert(res.message);
          openReceiptWindow(res.html);
        };

        const methodBtn = tr.querySelector('[data-act="method"]');
        if (methodBtn) {
          methodBtn.onclick = async () => {
            const next = p.paymentMethod === 'โอนเงิน' ? 'cash' : 'transfer';
            const label = next === 'cash' ? 'เงินสด' : 'โอนเงิน';
            if (!confirm(`เปลี่ยนวิธีชำระเงินของใบเสร็จ ${p.receiptNo} เป็น "${label}"?`)) return;
            const res = await callServer('updatePaymentMethod', { receiptNo: p.receiptNo, paymentMethod: next });
            alert(res.message);
            if (res.success) await loadLogs();
          };
        }

        const voidBtn = tr.querySelector('[data-act="void"]');
        if (voidBtn) {
          voidBtn.onclick = async () => {
            const reason = prompt('เหตุผลที่ยกเลิก/คืนเงิน:');
            if (reason === null) return;
            const res = await callServer('voidMembershipPayment', { receiptNo: p.receiptNo, reason });
            alert(res.message);
            if (res.success) await loadLogs();
          };
        }
        tbody.appendChild(tr);
      }
    }
  </script>
</body>
</html>
