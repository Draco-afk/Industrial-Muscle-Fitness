<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrial Muscle - Admin - POS</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700;900&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../shared/admin-nav.css">
  <style>
    .badge-Booked, .badge-normal { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .badge-Refunded { background: rgba(107,114,128,0.15); color: #9ca3af; }
  </style>
</head>
<body class="min-h-screen">
  <div id="loadingGate" class="fixed inset-0 bg-black flex items-center justify-center z-50">
    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-red-500"></i>
  </div>
  <div id="navSlot"></div>

  <div id="app" class="hidden md:ml-64 p-4 md:p-8 pt-24 md:pt-8 max-w-6xl">

    <div class="grid md:grid-cols-2 gap-6 mb-6">
      <div class="panel rounded-2xl p-5">
        <h3 class="text-xs uppercase tracking-widest text-gray-500 mb-3">รับชำระเงินลูกค้ารายวัน</h3>
        <input id="custName" placeholder="ชื่อลูกค้า" class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500 mb-2">
        <input id="custPhone" placeholder="เบอร์โทร (ถ้ามี)" class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500 mb-3">

        <p class="text-[10px] uppercase tracking-widest text-gray-500 mb-2">ค่าเข้ายิมรายวัน</p>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <div class="flex items-center gap-2 bg-black border border-gray-800 rounded-lg px-3 py-2">
            <label class="text-xs flex-1">นักเรียน/นักศึกษา</label>
            <input id="qtyStudent" type="number" min="0" value="0" class="w-14 bg-transparent text-sm outline-none text-right">
          </div>
          <div class="flex items-center gap-2 bg-black border border-gray-800 rounded-lg px-3 py-2">
            <label class="text-xs flex-1">ผู้ใหญ่</label>
            <input id="qtyAdult" type="number" min="0" value="0" class="w-14 bg-transparent text-sm outline-none text-right">
          </div>
        </div>

        <p class="text-[10px] uppercase tracking-widest text-gray-500 mb-2">สินค้า</p>
        <div id="productPicker" class="grid grid-cols-2 gap-2 mb-3 max-h-32 overflow-y-auto"></div>

        <p class="text-[10px] uppercase tracking-widest text-gray-500 mb-2">ค่าเทรนเนอร์ (เก็บแทนให้ ไม่ใช่รายรับยิม)</p>
        <div class="flex gap-2 mb-3">
          <input id="trainerFeeName" placeholder="ชื่อเทรนเนอร์" class="flex-1 bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
          <input id="trainerFeeAmount" type="number" placeholder="บาท" class="w-24 bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
        </div>

        <div class="flex gap-2 mb-3">
          <select id="payMethod" class="flex-1 bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
            <option value="cash">เงินสด</option>
            <option value="transfer">โอนเงิน</option>
          </select>
          <input id="couponCode" placeholder="โค้ดคูปอง (ถ้ามี)" class="flex-1 bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
        </div>

        <button onclick="submitPayment()" id="payBtn" class="w-full btn-primary py-3 rounded-xl text-sm font-bold uppercase tracking-wider">รับชำระเงิน</button>
        <p id="payErr" class="hidden text-red-400 text-xs bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2 mt-2"></p>
      </div>

      <div class="panel rounded-2xl p-5">
        <h3 class="text-xs uppercase tracking-widest text-gray-500 mb-3">รายการล่าสุด</h3>
        <div id="logList" class="space-y-2 text-sm max-h-[32rem] overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { callServer, auth, onAuthStateChanged, signOut } from '../shared/firebase-init.js';
    import { renderNav } from '../shared/admin-nav.js';

    let products = [];

    function escapeHtml(s) {
      return (s || '').toString().replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = '../login.html'; return; }
      const tok = await user.getIdTokenResult();
      if (tok.claims.role !== 'admin') { window.location.href = '../login.html'; return; }
      document.getElementById('navSlot').outerHTML = renderNav('pos', tok.claims.adminRole);
      document.getElementById('loadingGate').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      window.doLogout = async () => { await signOut(auth); window.location.href = '../login.html'; };
      await Promise.all([loadProducts(), loadLogs()]);
    });

    async function loadProducts() {
      products = await callServer('getProductList');
      const picker = document.getElementById('productPicker');
      picker.innerHTML = products.filter((p) => p.status === 'Active').map((p) => `
        <div class="flex items-center gap-2 bg-black border border-gray-800 rounded-lg px-3 py-2">
          <label class="text-xs flex-1 truncate" title="${escapeHtml(p.name)}">${escapeHtml(p.name)} (${p.price}฿)</label>
          <input type="number" min="0" value="0" data-product="${escapeHtml(p.name)}" data-price="${p.price}" class="prodQty w-12 bg-transparent text-sm outline-none text-right">
        </div>`).join('') || '<p class="text-gray-600 text-xs col-span-2">ยังไม่มีสินค้าในระบบ</p>';
    }

    window.submitPayment = async function submitPayment() {
      const dayPassItems = [
        { type: 'student', qty: parseInt(document.getElementById('qtyStudent').value, 10) || 0 },
        { type: 'adult', qty: parseInt(document.getElementById('qtyAdult').value, 10) || 0 }
      ];
      const items = Array.from(document.querySelectorAll('.prodQty'))
        .filter((el) => parseInt(el.value, 10) > 0)
        .map((el) => ({ name: el.dataset.product, price: parseFloat(el.dataset.price), qty: parseInt(el.value, 10) }));
      const trainerFeeName = document.getElementById('trainerFeeName').value.trim();
      const trainerFeeAmount = parseFloat(document.getElementById('trainerFeeAmount').value) || 0;
      const trainerFees = trainerFeeName && trainerFeeAmount > 0 ? [{ name: trainerFeeName, amount: trainerFeeAmount }] : [];

      const payload = {
        customerName: document.getElementById('custName').value.trim(),
        phone: document.getElementById('custPhone').value.trim(),
        dayPassItems, items, trainerFees,
        paymentMethod: document.getElementById('payMethod').value,
        couponCode: document.getElementById('couponCode').value.trim()
      };

      const btn = document.getElementById('payBtn');
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
      try {
        const res = await callServer('processDailyPayment', payload);
        if (res.success) {
          alert(res.message);
          document.getElementById('custName').value = '';
          document.getElementById('custPhone').value = '';
          document.getElementById('qtyStudent').value = '0';
          document.getElementById('qtyAdult').value = '0';
          document.getElementById('trainerFeeName').value = '';
          document.getElementById('trainerFeeAmount').value = '';
          document.getElementById('couponCode').value = '';
          document.querySelectorAll('.prodQty').forEach((el) => el.value = '0');
          document.getElementById('payErr').classList.add('hidden');
          await loadLogs();
        } else {
          showErr(res.message);
        }
      } catch (e) {
        showErr(e.message || 'เกิดข้อผิดพลาด');
      } finally {
        btn.disabled = false; btn.innerHTML = 'รับชำระเงิน';
      }
    };

    function showErr(msg) {
      const el = document.getElementById('payErr');
      el.textContent = msg; el.classList.remove('hidden');
    }

    async function loadLogs() {
      const logs = await callServer('getDailyPaymentLogs');
      const list = document.getElementById('logList');
      list.innerHTML = logs.length ? logs.map((l) => `
        <div class="border-b border-gray-900 pb-2">
          <div class="flex justify-between">
            <span class="font-medium">${escapeHtml(l.customerName)}</span>
            <span class="text-gray-400">${l.amount.toLocaleString('th-TH')} บาท</span>
          </div>
          <div class="flex justify-between text-xs text-gray-500">
            <span>${escapeHtml(l.itemSummary)}</span>
            <span>${escapeHtml(l.receiptNo)} ${l.refundStatus === 'Refunded' ? '(คืนเงินแล้ว)' : ''}</span>
          </div>
        </div>`).join('') : '<p class="text-gray-600 text-xs text-center py-4">ยังไม่มีรายการวันนี้</p>';
    }
  </script>
</body>
</html>
