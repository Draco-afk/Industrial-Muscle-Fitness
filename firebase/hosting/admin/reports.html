<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrial Muscle - Admin - Reports</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700;900&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../shared/admin-nav.css">
</head>
<body class="min-h-screen">
  <div id="loadingGate" class="fixed inset-0 bg-black flex items-center justify-center z-50">
    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-red-500"></i>
  </div>
  <div id="navSlot"></div>

  <div id="app" class="hidden md:ml-64 p-4 md:p-8 pt-24 md:pt-8 max-w-6xl">

    <div class="panel rounded-2xl p-5 mb-6">
      <h3 class="text-xs uppercase tracking-widest text-gray-500 mb-3">รายงานรายรับ</h3>
      <div class="flex flex-wrap gap-3 items-end">
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1">จากวันที่</label>
          <input id="startDate" type="date" class="bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1">ถึงวันที่</label>
          <input id="endDate" type="date" class="bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
        </div>
        <button onclick="loadReport()" class="bg-gray-900 hover:bg-gray-800 border border-gray-800 rounded-lg px-4 py-2 text-sm">ดูรายงาน</button>
        <button onclick="exportReport('exportMembersPDF')" class="text-xs text-gray-400 hover:text-white underline">Export รายชื่อสมาชิก</button>
        <button onclick="exportReport('exportPaymentsPDF')" class="text-xs text-gray-400 hover:text-white underline">Export ประวัติชำระเงิน</button>
        <button onclick="exportReport('exportDailyPaymentsPDF')" class="text-xs text-gray-400 hover:text-white underline">Export POS รายวัน</button>
      </div>
    </div>

    <div id="summary" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>

    <div class="grid md:grid-cols-2 gap-6 mb-6">
      <div class="panel rounded-2xl p-5">
        <h3 class="text-xs uppercase tracking-widest text-gray-500 mb-3">สินค้าขายดี</h3>
        <div id="topProducts" class="space-y-2 text-sm"></div>
      </div>
      <div class="panel rounded-2xl p-5">
        <h3 class="text-xs uppercase tracking-widest text-gray-500 mb-3">ค่าเทรนเนอร์ที่เก็บแทน (ไม่นับเป็นรายรับยิม)</h3>
        <div id="trainerFees" class="space-y-2 text-sm"></div>
      </div>
    </div>

    <div class="panel rounded-2xl overflow-hidden overflow-x-auto">
      <table class="w-full">
        <thead><tr><th>วันที่</th><th>สมาชิก</th><th>รายวัน</th><th>สินค้า</th><th>รวม</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { callServer, auth, onAuthStateChanged, signOut } from '../shared/firebase-init.js';
    import { renderNav } from '../shared/admin-nav.js';

    function escapeHtml(s) {
      return (s || '').toString().replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function baht(n) { return (n || 0).toLocaleString('th-TH'); }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = '../login.html'; return; }
      const tok = await user.getIdTokenResult();
      if (tok.claims.role !== 'admin') { window.location.href = '../login.html'; return; }
      document.getElementById('navSlot').outerHTML = renderNav('reports', tok.claims.adminRole);
      document.getElementById('loadingGate').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      window.doLogout = async () => { await signOut(auth); window.location.href = '../login.html'; };

      const today = new Date();
      const monthAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
      document.getElementById('startDate').value = monthAgo.toISOString().slice(0, 10);
      document.getElementById('endDate').value = today.toISOString().slice(0, 10);
      await loadReport();
    });

    window.loadReport = async function loadReport() {
      const startDateStr = document.getElementById('startDate').value;
      const endDateStr = document.getElementById('endDate').value;
      let report;
      try {
        report = await callServer('getRevenueReport', { startDateStr, endDateStr });
      } catch (e) {
        alert('โหลดรายงานไม่สำเร็จ: ' + (e.message || e));
        return;
      }

      document.getElementById('summary').innerHTML = `
        <div class="panel rounded-2xl p-5"><p class="text-[10px] uppercase tracking-widest text-gray-500 mb-1">รายรับรวม</p><p class="text-2xl font-black">${baht(report.totals.grandTotal)}</p></div>
        <div class="panel rounded-2xl p-5"><p class="text-[10px] uppercase tracking-widest text-gray-500 mb-1">รายจ่าย</p><p class="text-2xl font-black text-red-400">${baht(report.totals.expenses)}</p></div>
        <div class="panel rounded-2xl p-5"><p class="text-[10px] uppercase tracking-widest text-gray-500 mb-1">กำไรสุทธิ</p><p class="text-2xl font-black text-green-400">${baht(report.totals.netProfit)}</p></div>
        <div class="panel rounded-2xl p-5"><p class="text-[10px] uppercase tracking-widest text-gray-500 mb-1">เงินสด / โอน</p><p class="text-lg font-black">${baht(report.totals.cash)} / ${baht(report.totals.transfer)}</p></div>
      `;

      document.getElementById('topProducts').innerHTML = report.topProducts.length
        ? report.topProducts.slice(0, 10).map((p) => `<div class="flex justify-between border-b border-gray-900 pb-1"><span>${escapeHtml(p.name)} (${p.qty})</span><span class="text-gray-400">${baht(p.revenue)}</span></div>`).join('')
        : '<p class="text-gray-600 text-xs">ไม่มีข้อมูล</p>';

      document.getElementById('trainerFees').innerHTML = report.trainerFees.breakdown.length
        ? report.trainerFees.breakdown.map((t) => `<div class="flex justify-between border-b border-gray-900 pb-1"><span>${escapeHtml(t.name)}</span><span class="text-gray-400">${baht(t.amount)}</span></div>`).join('')
        : '<p class="text-gray-600 text-xs">ไม่มีข้อมูล</p>';

      const tbody = document.getElementById('rows');
      tbody.innerHTML = report.breakdown.map((d) => `
        <tr>
          <td class="text-gray-400">${d.date}</td>
          <td class="text-gray-400">${baht(d.membership)}</td>
          <td class="text-gray-400">${baht(d.dayPass)}</td>
          <td class="text-gray-400">${baht(d.products)}</td>
          <td class="font-medium">${baht(d.membership + d.dayPass + d.products)}</td>
        </tr>`).join('');
    };

    window.exportReport = async function exportReport(fnName) {
      const res = await callServer(fnName);
      if (!res.success) { alert(res.message || 'Export ไม่สำเร็จ'); return; }
      const w = window.open('', '_blank');
      w.document.write(res.html);
      w.document.close();
    };
  </script>
</body>
</html>
