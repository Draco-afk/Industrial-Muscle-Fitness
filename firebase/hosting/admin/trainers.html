<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrial Muscle - Admin - Trainers</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700;900&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../shared/admin-nav.css">
  <style>
    .badge-available { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-busy { background: rgba(239,68,68,0.15); color: #f87171; }
  </style>
</head>
<body class="min-h-screen">
  <div id="loadingGate" class="fixed inset-0 bg-black flex items-center justify-center z-50">
    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-red-500"></i>
  </div>
  <div id="navSlot"></div>

  <div id="app" class="hidden md:ml-64 p-4 md:p-8 pt-24 md:pt-8 max-w-6xl">

    <div class="flex items-center justify-end mb-4">
      <button onclick="openAddModal()" class="bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white text-xs font-bold uppercase tracking-wider px-5 py-2.5 rounded-xl shadow-lg hover:shadow-red-600/20">
        <i class="fa-solid fa-plus mr-1"></i> เพิ่มเทรนเนอร์
      </button>
    </div>

    <div class="panel rounded-2xl overflow-hidden overflow-x-auto">
      <table class="w-full">
        <thead><tr>
          <th>ชื่อ-นามสกุล</th><th>ความเชี่ยวชาญ</th><th>เบอร์โทร</th><th>วันทำงาน</th><th>เวลาทำงาน</th><th>สถานะ</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="emptyState" class="hidden text-center text-gray-600 text-sm py-10">ยังไม่มีเทรนเนอร์ในระบบ</p>
    </div>
  </div>

  <div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-40 overflow-y-auto">
    <div class="panel rounded-2xl p-6 max-w-md w-full space-y-3 my-8">
      <h2 id="modalTitle" class="text-lg font-bold">เพิ่มเทรนเนอร์ใหม่</h2>
      <input type="hidden" id="f_docId">
      <div>
        <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1">ชื่อ-นามสกุล</label>
        <input id="f_fullName" class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1">ความเชี่ยวชาญ</label>
          <input id="f_specialty" class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1">เบอร์โทร</label>
          <input id="f_phone" class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
        </div>
      </div>
      <div>
        <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1">วันทำงาน</label>
        <div id="dayChecks" class="flex flex-wrap gap-2"></div>
      </div>
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1">เริ่มงาน</label>
          <input id="f_startHour" type="time" class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1">เลิกงาน</label>
          <input id="f_endHour" type="time" class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1">นาที/คิว</label>
          <input id="f_slotMinutes" type="number" value="60" class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1">อีเมล</label>
          <input id="f_email" class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1">สถานะ</label>
          <select id="f_status" class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1">ประวัติย่อ (Bio)</label>
        <textarea id="f_bio" rows="2" class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-500"></textarea>
      </div>
      <p id="modalErr" class="hidden text-red-400 text-xs bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2"></p>
      <div class="flex gap-3 pt-2">
        <button onclick="closeModal()" class="flex-1 bg-gray-900 hover:bg-gray-800 border border-gray-800 py-2.5 rounded-xl text-sm">ยกเลิก</button>
        <button onclick="submitTrainer()" id="submitBtn" class="flex-1 bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 py-2.5 rounded-xl text-sm font-bold">บันทึก</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { callServer, auth, onAuthStateChanged, signOut } from '../shared/firebase-init.js';
    import { renderNav } from '../shared/admin-nav.js';

    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const DAY_LABEL = { Sun: 'อา', Mon: 'จ', Tue: 'อ', Wed: 'พ', Thu: 'พฤ', Fri: 'ศ', Sat: 'ส' };
    let trainers = [];

    document.getElementById('dayChecks').innerHTML = DAYS.map((d) =>
      `<label class="flex items-center gap-1 text-xs bg-black border border-gray-800 rounded-lg px-2 py-1.5 cursor-pointer">
        <input type="checkbox" value="${d}" class="dayChk accent-red-600"> ${DAY_LABEL[d]}
      </label>`).join('');

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = '../login.html'; return; }
      const tok = await user.getIdTokenResult();
      if (tok.claims.role !== 'admin') { window.location.href = '../login.html'; return; }
      document.getElementById('navSlot').outerHTML = renderNav('trainers', tok.claims.adminRole);
      document.getElementById('loadingGate').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      window.doLogout = async () => { await signOut(auth); window.location.href = '../login.html'; };
      await loadTrainers();
    });

    async function loadTrainers() {
      try { trainers = await callServer('getTrainerList'); } catch (e) { alert('โหลดข้อมูลไม่สำเร็จ: ' + (e.message || e)); trainers = []; }
      render();
    }

    function escapeHtml(s) {
      return (s || '').toString().replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function render() {
      const tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      document.getElementById('emptyState').classList.toggle('hidden', trainers.length > 0);
      for (const t of trainers) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="font-medium">${escapeHtml(t.fullName)}</td>
          <td class="text-gray-400">${escapeHtml(t.specialty)}</td>
          <td class="text-gray-400 font-mono">${escapeHtml(t.phone)}</td>
          <td class="text-gray-400">${(t.workingDays || []).map((d) => DAY_LABEL[d] || d).join(' ')}</td>
          <td class="text-gray-400 font-mono">${t.startHour}-${t.endHour}</td>
          <td><span class="badge ${t.busyStatus === 'Busy' ? 'badge-busy' : 'badge-available'}">${t.busyStatus === 'Busy' ? 'ติดลูกค้า' : 'ว่าง'}</span></td>
          <td class="text-right whitespace-nowrap">
            <button data-act="schedule" class="text-gray-400 hover:text-white px-1.5" title="ดูตารางคิว"><i class="fa-solid fa-calendar-day"></i></button>
            <button data-act="line" class="text-green-400 hover:text-green-300 px-1.5" title="เชื่อม/ทดสอบ LINE"><i class="fa-brands fa-line"></i></button>
            <button data-act="pin" class="text-orange-400 hover:text-orange-300 px-1.5" title="รีเซ็ต PIN"><i class="fa-solid fa-key"></i></button>
            <button data-act="toggle" class="text-yellow-400 hover:text-yellow-300 px-1.5" title="สลับสถานะว่าง/ไม่ว่าง"><i class="fa-solid fa-toggle-on"></i></button>
            <button data-act="edit" class="text-blue-400 hover:text-blue-300 px-1.5" title="แก้ไข"><i class="fa-solid fa-pen"></i></button>
            <button data-act="delete" class="text-red-400 hover:text-red-300 px-1.5" title="ลบ"><i class="fa-solid fa-trash"></i></button>
          </td>`;
        tr.querySelector('[data-act="toggle"]').onclick = () => toggleBusy(t);
        tr.querySelector('[data-act="edit"]').onclick = () => openEditModal(t);
        tr.querySelector('[data-act="delete"]').onclick = () => deleteTrainer(t);
        tr.querySelector('[data-act="schedule"]').onclick = () => viewSchedule(t);
        tr.querySelector('[data-act="line"]').onclick = () => trainerLineMenu(t);
        tr.querySelector('[data-act="pin"]').onclick = () => resetPin(t);
        tbody.appendChild(tr);
      }
    }

    async function toggleBusy(t) {
      const res = await callServer('adminSetTrainerBusyStatus', { docId: t.docId, isBusy: t.busyStatus !== 'Busy' });
      if (res.success) await loadTrainers(); else alert(res.message);
    }

    async function viewSchedule(t) {
      const dateStr = prompt(`ดูตารางคิวของ "${t.fullName}" วันที่ไหน? (YYYY-MM-DD)`, new Date().toISOString().slice(0, 10));
      if (!dateStr) return;
      const list = await callServer('getTrainerScheduleByDate', { trainerId: t.trainerId, dateStr });
      if (!list.length) { alert(`${t.fullName} — ${dateStr}\n\nไม่มีคิวในวันนี้`); return; }
      const lines = list.map((b) => `${b.timeSlot}  ${b.memberName}${b.memberPhone ? ' (' + b.memberPhone + ')' : ''}  [${b.status}]`);
      alert(`ตารางคิว ${t.fullName} — ${dateStr}\n\n${lines.join('\n')}`);
    }

    async function resetPin(t) {
      if (!confirm(`รีเซ็ต PIN ของ "${t.fullName}" กลับเป็น 1234?\n\nเทรนเนอร์จะต้องใช้ 1234 เข้าระบบครั้งถัดไป และควรเปลี่ยนเองทันที`)) return;
      const res = await callServer('resetTrainerPin', { trainerDocId: t.docId });
      alert(res.message);
    }

    // Admin-side LINE helper: hand the trainer a link code, or fire a test
    // message to check the connection actually works.
    async function trainerLineMenu(t) {
      const choice = prompt(
        `LINE ของ "${t.fullName}"\n\nพิมพ์ 1 = ขอรหัสเชื่อม LINE ให้เทรนเนอร์\nพิมพ์ 2 = ส่งข้อความทดสอบ`, '1');
      if (choice === '1') {
        const res = await callServer('generateTrainerLineLinkCode', { docId: t.docId });
        if (!res.success) return alert(res.message);
        alert(`รหัสเชื่อม LINE ของ "${t.fullName}" คือ:\n\n${res.code}\n\nให้เทรนเนอร์เพิ่มเพื่อน LINE OA ของยิม แล้วส่งรหัสนี้ทางแชท`);
      } else if (choice === '2') {
        const res = await callServer('testSendLineMessageToTrainer', { docId: t.docId });
        alert(res.message);
      }
    }

    async function deleteTrainer(t) {
      if (!confirm(`ลบเทรนเนอร์ "${t.fullName}" ออกจากระบบถาวร?`)) return;
      const res = await callServer('deleteTrainerData', { docId: t.docId });
      alert(res.message);
      if (res.success) await loadTrainers();
    }

    window.openAddModal = function openAddModal() {
      document.getElementById('modalTitle').textContent = 'เพิ่มเทรนเนอร์ใหม่';
      document.getElementById('f_docId').value = '';
      ['f_fullName', 'f_specialty', 'f_phone', 'f_email', 'f_bio'].forEach((id) => document.getElementById(id).value = '');
      document.getElementById('f_startHour').value = '09:00';
      document.getElementById('f_endHour').value = '18:00';
      document.getElementById('f_slotMinutes').value = '60';
      document.getElementById('f_status').value = 'Active';
      document.querySelectorAll('.dayChk').forEach((c) => c.checked = false);
      document.getElementById('modalErr').classList.add('hidden');
      document.getElementById('modal').classList.remove('hidden');
    };

    function openEditModal(t) {
      document.getElementById('modalTitle').textContent = 'แก้ไขข้อมูลเทรนเนอร์';
      document.getElementById('f_docId').value = t.docId;
      document.getElementById('f_fullName').value = t.fullName || '';
      document.getElementById('f_specialty').value = t.specialty || '';
      document.getElementById('f_phone').value = t.phone || '';
      document.getElementById('f_email').value = t.email || '';
      document.getElementById('f_bio').value = t.bio || '';
      document.getElementById('f_startHour').value = t.startHour || '09:00';
      document.getElementById('f_endHour').value = t.endHour || '18:00';
      document.getElementById('f_slotMinutes').value = t.slotMinutes || 60;
      document.getElementById('f_status').value = t.status || 'Active';
      document.querySelectorAll('.dayChk').forEach((c) => c.checked = (t.workingDays || []).includes(c.value));
      document.getElementById('modalErr').classList.add('hidden');
      document.getElementById('modal').classList.remove('hidden');
    }

    window.closeModal = function closeModal() { document.getElementById('modal').classList.add('hidden'); };

    window.submitTrainer = async function submitTrainer() {
      const docId = document.getElementById('f_docId').value;
      const payload = {
        fullName: document.getElementById('f_fullName').value.trim(),
        specialty: document.getElementById('f_specialty').value.trim(),
        phone: document.getElementById('f_phone').value.trim(),
        email: document.getElementById('f_email').value.trim(),
        bio: document.getElementById('f_bio').value.trim(),
        startHour: document.getElementById('f_startHour').value,
        endHour: document.getElementById('f_endHour').value,
        slotMinutes: parseInt(document.getElementById('f_slotMinutes').value, 10) || 60,
        status: document.getElementById('f_status').value,
        workingDays: Array.from(document.querySelectorAll('.dayChk:checked')).map((c) => c.value)
      };
      if (!payload.fullName) return showModalErr('กรุณากรอกชื่อเทรนเนอร์');

      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
      try {
        const res = docId
          ? await callServer('updateTrainerData', { ...payload, docId })
          : await callServer('addTrainerData', payload);
        if (res.success) { window.closeModal(); await loadTrainers(); if (!docId) alert(res.message); }
        else showModalErr(res.message);
      } catch (e) {
        showModalErr(e.message || 'เกิดข้อผิดพลาด');
      } finally {
        btn.disabled = false; btn.innerHTML = 'บันทึก';
      }
    };

    function showModalErr(msg) {
      const el = document.getElementById('modalErr');
      el.textContent = msg; el.classList.remove('hidden');
    }
  </script>
</body>
</html>
