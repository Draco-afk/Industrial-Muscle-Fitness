<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrial Muscle - Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700;900&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background-color: #050505; color: #F3F4F6; font-family: 'Prompt', sans-serif;
      background-image:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 14px),
        radial-gradient(ellipse at top, rgba(220, 38, 38, 0.10), transparent 55%);
      background-size: 14px 100%, 100% 100%;
    }
    .industrial-card { background: rgba(15,15,15,0.9); border: 1px solid #222; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
    .fld { width: 100%; background: #000; border: 1px solid #1f2937; border-radius: 12px; padding: 12px; font-size: 13px; color: #fff; outline: none; }
    .fld:focus { border-color: #ef4444; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <div class="industrial-card rounded-3xl p-10 max-w-md w-full relative overflow-hidden">
    <div class="absolute top-0 left-0 w-1.5 h-full bg-red-600"></div>

    <div class="text-center mb-8">
      <h1 class="text-3xl font-black tracking-tighter font-['Urbanist']">INDUSTRIAL</h1>
      <p class="text-red-500 font-bold tracking-[0.3em] text-xs uppercase">Muscle</p>
      <p class="text-gray-500 text-xs tracking-widest uppercase mt-4">Reset Password</p>
    </div>

    <!-- Step 1: ask for a reset link -->
    <div id="requestView" class="space-y-4">
      <p class="text-gray-400 text-xs">กรอกชื่อผู้ใช้หรืออีเมลของบัญชีแอดมิน ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้</p>
      <input id="userOrEmail" class="fld" placeholder="Username หรือ อีเมล">
      <button id="btnRequest" class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 py-3.5 rounded-xl text-sm font-black uppercase tracking-widest">ขอลิงก์ตั้งรหัสใหม่</button>
      <p id="requestMsg" class="hidden text-xs text-center rounded-lg py-2 px-3"></p>
      <a href="login.html" class="block text-center text-gray-500 hover:text-gray-300 text-xs mt-2">← กลับไปหน้าเข้าสู่ระบบ</a>
    </div>

    <!-- Step 2: arrived from the emailed link -->
    <div id="resetView" class="hidden space-y-4">
      <p id="resetIntro" class="text-gray-400 text-xs">ตั้งรหัสผ่านใหม่สำหรับบัญชีนี้</p>
      <input id="newPassword" type="password" class="fld" placeholder="รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)">
      <input id="confirmPassword" type="password" class="fld" placeholder="ยืนยันรหัสผ่านใหม่">
      <button id="btnReset" class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 py-3.5 rounded-xl text-sm font-black uppercase tracking-widest">ตั้งรหัสผ่านใหม่</button>
      <p id="resetMsg" class="hidden text-xs text-center rounded-lg py-2 px-3"></p>
    </div>

    <div id="invalidView" class="hidden text-center space-y-4">
      <i class="fa-solid fa-link-slash text-4xl text-gray-700"></i>
      <p id="invalidMsg" class="text-gray-400 text-sm">ลิงก์นี้ไม่ถูกต้องหรือหมดอายุแล้ว</p>
      <a href="reset-password.html" class="block text-red-400 hover:text-red-300 text-xs">ขอลิงก์ใหม่</a>
    </div>
  </div>

  <script type="module">
    import { callServer } from './shared/firebase-init.js';

    const $ = (id) => document.getElementById(id);
    const rtoken = new URLSearchParams(location.search).get('rtoken');

    function msg(el, text, ok) {
      el.textContent = text;
      el.className = `text-xs text-center rounded-lg py-2 px-3 ${ok
        ? 'text-green-400 bg-green-500/10 border border-green-500/20'
        : 'text-red-400 bg-red-500/10 border border-red-500/20'}`;
      el.classList.remove('hidden');
    }

    function show(view) {
      ['requestView', 'resetView', 'invalidView'].forEach((v) => $(v).classList.toggle('hidden', v !== view));
    }

    // A token in the URL means the admin followed the emailed link.
    if (rtoken) {
      show('resetView');
      callServer('checkResetTokenValid', { rtoken }).then((res) => {
        if (!res || !res.valid) show('invalidView');
      }).catch(() => show('invalidView'));
    }

    $('btnRequest').addEventListener('click', async () => {
      const usernameOrEmail = $('userOrEmail').value.trim();
      if (!usernameOrEmail) return msg($('requestMsg'), 'กรุณากรอกชื่อผู้ใช้หรืออีเมล', false);
      const btn = $('btnRequest');
      btn.disabled = true;
      try {
        const res = await callServer('requestAdminPasswordReset', { usernameOrEmail });
        msg($('requestMsg'), res.message, !!res.success);
      } catch (e) {
        msg($('requestMsg'), e.message || 'เกิดข้อผิดพลาด', false);
      } finally {
        btn.disabled = false;
      }
    });

    $('btnReset').addEventListener('click', async () => {
      const newPassword = $('newPassword').value;
      if (newPassword.length < 6) return msg($('resetMsg'), 'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร', false);
      if (newPassword !== $('confirmPassword').value) return msg($('resetMsg'), 'รหัสผ่านทั้งสองช่องไม่ตรงกัน', false);

      const btn = $('btnReset');
      btn.disabled = true;
      try {
        const res = await callServer('resetAdminPassword', { rtoken, newPassword });
        msg($('resetMsg'), res.message, !!res.success);
        if (res.success) setTimeout(() => { window.location.href = 'login.html'; }, 1800);
      } catch (e) {
        msg($('resetMsg'), e.message || 'เกิดข้อผิดพลาด', false);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
